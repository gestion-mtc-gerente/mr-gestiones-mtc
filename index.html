      <div class="campo-mtc"><div class="et">Número de documento</div><div class="val">${escapa(dni)}</div></div>
    </div>
  </div>`;

  const tarjetas = coincidencias.map(t => {
    const e = ESTADOS[t.estado] || { txt:t.estado, clase:"e-tramite" };
    const claseColor = { tramite:"e-tramite", aprobado:"e-aprobado", observado:"e-observado", finalizado:"e-finalizado" }[t.estado] || "e-tramite";
    const actualizado = (t.historial && t.historial[0]) ? t.historial[0].fecha : t.fechaRegistro;
    const codigo = t.id.replace("E","EXP-");
    const docs = t.docs || [];
    const docsHtml = docs.length
      ? `<div class="docs-box"><span class="et">Documentos de tu trámite</span>${docs.map(d => `
          <a class="doc-link" href="${d.data}" download="${escapa(d.nombre)}" target="_blank" rel="noopener">

    const cargaHtml = t.estado === "tramite"

    const tramiteCard = `<div class="tramite-card">
      <div class="top">

          <div class="tipo">${escapa(TIPOS[t.tipo] || t.tipo)}</div>

    if (!t.numeroLicencia) return tramiteCard;

    const panelLicencia = `<div class="panel-mtc">
      <h2>Licencia · ${escapa(TIPOS[t.tipo] || t.tipo)}</h2>
      <div class="grid">
        <div class="campo-mtc"><div class="et">Clase y categoría</div><div class="val">${escapa(t.categoria) || "—"}</div></div>
        <div class="campo-mtc"><div class="et">Tipo de licencia</div><div class="val">${escapa(t.tipoLicencia) || "—"}</div></div>
        <div class="campo-mtc"><div class="et">Restricciones</div><div class="val">${escapa(t.restricciones) || "Sin restricciones"}</div></div>
        <div class="campo-mtc"><div class="et">Centro de emisión</div><div class="val">${escapa(t.centroEmision) || "—"}</div></div>

        <div class="campo-mtc"><div class="et">Vigente hasta</div><div class="val">${escapa(t.vigenteHasta) || "—"}</div></div>
      </div>
    </div>`;
    return tramiteCard + panelLicencia;
  }).join("");

  panelTramite.innerHTML = panelConductor + tarjetas;
}

function filtrarCat(){

function registrarSolicitud(){
  const dni = $("pDni").value.trim(), nom = $("pNom").value.trim(), ape = $("pApe").value.trim();
  const msg = $("pMsg");
  const sel = [...document.querySelectorAll(".chkPap:checked")].map(c => c.value);
  if (!/^\d{8}$/.test(dni)){ msg.style.color="var(--rojo)"; msg.textContent="El DNI debe tener 8 dígitos."; return; }
  if (!nom || !ape){ msg.style.color="var(--rojo)"; msg.textContent="Nombres y apellidos son obligatorios."; return; }
  if (!sel.length){ msg.style.color="var(--rojo)"; msg.textContent="Selecciona al menos una papeleta."; return; }
  const fecha = $("pFecha").value;
  const firma = dni + "|" + sel.slice().sort().join(",") + "|" + fecha;
  if (solicitudes.some(s => s.firma === firma)){
    msg.style.color="var(--rojo)"; msg.textContent="Ya existe una solicitud idéntica para este cliente."; return;
  }
  const est = $("pEstado").value;
  const filasOficiales = leerFilasOficialesDesdeDOM().filter(f => f.entidad || f.papeleta || f.falta);
  const s = {
    id: "S" + Date.now(), firma, dni, nombres:nom, apellidos:ape,
    telefono:$("pTel").value.trim(), correo:$("pCor").value.trim(), direccion:$("pDir").value.trim(),
    observaciones:$("pObs").value.trim(), estado:est,
    papeletas: sel.map(c => ({ codigo:c, fecha, estado:"Pendiente" })),
    consultaOficial: filasOficiales.length ? { ...infoOficialEscaneada, filas: filasOficiales } : null,
    pagoConfirmadoMs: null,
    creadoMs: Date.now(), fechaRegistro: ahora(), actualizado: ahora(),
    historial:[{ fecha: ahora(), usuario: sesion.nombre, accion:"Registró la solicitud con " + sel.length + " papeleta(s)" }]
  };
  solicitudes.unshift(s);
  guarda("mtc_solicitudes", solicitudes);
  guardarSolicitudNube(s);
  log(`Registró solicitud de papeletas · DNI ${dni} (${sel.length})`);
  notificar(`Nueva solicitud de papeletas: ${nom} ${ape} (${sel.length} papeleta/s)`);
  msg.style.color="var(--verde)"; msg.textContent="Solicitud registrada ✓";
  ["pDni","pNom","pApe","pTel","pCor","pDir","pObs"].forEach(i => $(i).value = "");
  document.querySelectorAll(".chkPap:checked").forEach(c => c.checked = false);
  filasOficialesEscaneadas = [];
  infoOficialEscaneada = null;
  renderTablaOficialEditable();
  $("pScanOficialMsg").innerHTML = "";
}

// Tabla de la consulta oficial escaneada, con las mismas columnas que scppp.mtc.gob.pe.
// Se usa tanto en la tarjeta interna del gestor como en las consultas que ve el cliente.
// ---------- Eliminar papeleta: pago por QR + 24h de trámite ----------
// El portal público no tiene servidor propio (solo lee un archivo que tú exportas), así que el
// clic del cliente en "Eliminar papeleta" no le llega a nadie automáticamente. Por eso el flujo
// real es: el cliente paga y manda el comprobante por WhatsApp → tú confirmas el pago DENTRO
// del sistema (ahí sí queda guardado) → recién ahí arrancan las 24 horas, que se ven reflejadas
// después en la consulta del cliente cuando publiques el portal de nuevo.
const HORAS_ELIMINACION_PAPELETA = 24;
function fraccionEliminacion(s){
  if (!s.pagoConfirmadoMs) return 0;
  const total = HORAS_ELIMINACION_PAPELETA * 3600000;
  return Math.min(1, Math.max(0, (Date.now() - s.pagoConfirmadoMs) / total));
}
// Curva "rápido al principio, lento después": con solo 10% del tiempo real ya se ve ~27% de
// barra, para que se sienta que arrancó rápido aunque el trámite dure 24 horas de verdad.
function porcentajeVisualEliminacion(s){
  const p = fraccionEliminacion(s);
  return Math.round(100 * (1 - Math.pow(1 - p, 3)));
}
function bloqueEliminarPapeleta(s, esAdmin){
  if (s.pagoConfirmadoMs){
    const pct = porcentajeVisualEliminacion(s);
    const listo = fraccionEliminacion(s) >= 1;
    const restanteMs = Math.max(0, s.pagoConfirmadoMs + HORAS_ELIMINACION_PAPELETA*3600000 - Date.now());
    const h = Math.floor(restanteMs/3600000), m = Math.floor((restanteMs%3600000)/60000);
    return `<div class="elim-pap" data-id="${s.id}" style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--borde)">
      <span style="font-size:10.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;font-weight:700">Eliminación de papeleta</span>
      <p style="font-size:13px;margin:6px 0 8px;font-weight:700;color:${listo?"var(--verde)":"var(--rojo-osc)"}">${listo ? "✓ Trámite de eliminación completado." : "⏳ Eliminación en proceso…"}</p>
      <div style="background:var(--fondo);border-radius:20px;height:10px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)">
        <div class="barra-elim" style="height:100%;border-radius:20px;width:${pct}%;background:linear-gradient(90deg,#F77F00,#FFB066);transition:width 1s linear"></div>
      </div>
      <p style="font-size:11px;color:var(--gris);margin-top:6px">${listo ? "Ya se cumplieron las 24 horas del trámite." : `Tiempo restante estimado: ${h}h ${m}min`}</p>
    </div>`;
  }
  const waTexto = encodeURIComponent(`Hola, adjunto el comprobante de pago para eliminar mi papeleta (DNI ${s.dni}).`);
  const linkWa = EMPRESA.telefono ? `https://wa.me/${EMPRESA.telefono.replace(/\D/g,"")}?text=${waTexto}` : "";
  const botonConfirmar = esAdmin
    ? `<button class="btn-sec" style="margin-top:8px;font-size:12px" onclick="confirmarPagoPapeleta('${s.id}')">✅ Confirmar pago recibido (inicia las 24h)</button>`
    : "";
  return `<div class="elim-pap" data-id="${s.id}" style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--borde)">
    <button type="button" class="btn-sec" style="font-size:12px" onclick="const d=document.getElementById('qrPago${s.id}'); d.classList.toggle('oculto')">🗑️ Eliminar esta papeleta</button>
    <div id="qrPago${s.id}" class="oculto" style="margin-top:10px;text-align:center;background:var(--fondo);border-radius:10px;padding:14px">
      <p style="font-size:12.5px;margin-bottom:10px">Escanea el código y realiza el pago del trámite de eliminación:</p>
      <img src="${QR_PAGO_PAPELETA}" style="width:160px;height:160px;object-fit:contain;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--borde)">
      <p style="font-size:11.5px;color:var(--gris);margin-top:10px">Después de pagar, envíanos la constancia de pago${linkWa ? "" : " (contáctanos)"} para iniciar las 24 horas del trámite.</p>
      ${linkWa ? `<a class="btn" style="display:inline-block;margin-top:8px;font-size:12px;text-decoration:none" href="${linkWa}" target="_blank" rel="noopener">📲 Enviar comprobante por WhatsApp</a>` : ""}
      ${botonConfirmar}
    </div>
  </div>`;
}
function confirmarPagoPapeleta(id){
  const s = solicitudes.find(x => x.id === id);
  if (!s) return;
  if (!confirm("¿Confirmas que ya recibiste el pago del trámite de eliminación? Se iniciará el conteo de 24 horas.")) return;
  s.pagoConfirmadoMs = Date.now();
  s.historial.unshift({ fecha: ahora(), usuario: sesion.nombre, accion: "Confirmó el pago del trámite de eliminación (inicia 24h)" });
  guarda("mtc_solicitudes", solicitudes);
  guardarSolicitudNube(s);
  log(`Confirmó pago de eliminación de papeleta · DNI ${s.dni}`);
  irVista(vistaActual);
}
// Actualiza en vivo (cada minuto) las barras de eliminación visibles, sin recargar toda la vista.
setInterval(() => {
  document.querySelectorAll(".elim-pap .barra-elim").forEach(barra => {
    const cont = barra.closest(".elim-pap");
    const s = solicitudes.find(x => x.id === cont.dataset.id);
    if (s) barra.style.width = porcentajeVisualEliminacion(s) + "%";

}, 60000);

  return `<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--borde)">

function tickCrono(){
  document.querySelectorAll(".crono").forEach(el => {
    const s = solicitudes.find(x => x.id === el.dataset.id);
    if (!s) return;
    let r = limiteMs(s) - Date.now();
    if (r <= 0){ el.textContent = "00:00:00"; return; }
    const h = Math.floor(r/3600000), m = Math.floor(r%3600000/60000), sg = Math.floor(r%60000/1000);
    el.textContent = [h,m,sg].map(n => String(n).padStart(2,"0")).join(":");
  });
}
function cambiarEstadoSol(id, nuevo){
  const s = solicitudes.find(x => x.id === id);
  s.estado = nuevo; s.actualizado = ahora();
  s.historial.unshift({ fecha: ahora(), usuario: sesion.nombre, accion:"Cambió el estado a " + EST_PAP[nuevo].etq });
  guarda("mtc_solicitudes", solicitudes);
  guardarSolicitudNube(s);
  log(`Cambió estado de solicitud DNI ${s.dni} → ${EST_PAP[nuevo].etq}`);
  notificar(`Solicitud de ${s.nombres} ${s.apellidos}: ${EST_PAP[nuevo].txt}`);
  pintarPapeletas();
}
function eliminarSolicitud(id){
  if (sesion.rol !== "admin") return alert("Solo un administrador puede eliminar solicitudes.");
  const s = solicitudes.find(x => x.id === id);
  if (!confirm(`¿Eliminar la solicitud de ${s.nombres} ${s.apellidos}?`)) return;
  solicitudes = solicitudes.filter(x => x.id !== id);
  guarda("mtc_solicitudes", solicitudes);
  eliminarSolicitudNube(id);
  log(`Eliminó solicitud de papeletas DNI ${s.dni}`);
  pintarPapeletas();
}

}

          ${[["24","24 horas"],["48","48 horas"],["72","72 horas"],["168","7 días"]].map(([v,t]) =>
            `<option value="${v}" ${cfgPap.horas==v?"selected":""}>${t}</option>`).join("")}
        </select></div>
        <div><label>Cambiar a</label><select id="cpDestino">
          ${Object.entries(EST_PAP).map(([k,v]) => `<option value="${k}" ${cfgPap.destino===k?"selected":""}>${v.etq}</option>`).join("")}

      <button class="btn" style="width:100%" onclick="guardarCfgPap()">💾 GUARDAR</button>
    </div>`;
}
function guardarCfgPap(){
  cfgPap = { activo:$("cpActivo").checked, horas:parseInt($("cpHoras").value), destino:$("cpDestino").value };
  guarda("mtc_cfgpap", cfgPap);
  log(`Configuró automatización de papeletas: ${cfgPap.activo?"activa":"inactiva"}, ${cfgPap.horas}h → ${EST_PAP[cfgPap.destino].etq}`);
  alert("Configuración guardada.");
  motorPapeletas();
}
function motorPapeletas(){
  if (!cfgPap.activo) return;
  const cambiadas = [];
  solicitudes.forEach(s => {
    if (s.estado !== cfgPap.destino && s.estado !== "finalizada" && Date.now() >= limiteMs(s)){
      s.estado = cfgPap.destino; s.actualizado = ahora();
      s.historial.unshift({ fecha: ahora(), usuario:"Sistema (automático)", accion:"Cambio automático a " + EST_PAP[cfgPap.destino].etq });
      notificar(`⚙️ Automático: solicitud de ${s.nombres} ${s.apellidos} → ${EST_PAP[cfgPap.destino].etq}`);
      cambiadas.push(s);
    }
  });
  if (cambiadas.length){
    guarda("mtc_solicitudes", solicitudes);
    cambiadas.forEach(guardarSolicitudNube);
    if (sesion && vistaActual === "papeletas") pintarPapeletas();
  }
}

function busquedaGlobal(){
  const q = $("buscadorGlobal").value.trim();
  if (q.length < 2) return;
  if (vistaActual !== "todos" && !TIPOS[vistaActual]) irVista("todos");
  setTimeout(() => { const f = $("fDni"); if (f){ f.value = q; pintarTabla(); } }, 50);
}

// ---------- Automatización de estados ----------
function motorAutomatico(){
  if (!config.autoActivo) return;
  const limite = config.autoHoras * 3600000;
  const cambiadas = [];
  expedientes.forEach(e => {
    if (e.estado === "tramite" && e.registroMs && Date.now() - e.registroMs >= limite){
      e.estado = config.autoDestino;
      e.historial.unshift({ fecha: ahora(), usuario:"Sistema (automático)", accion:"Cambio automático a " + ESTADOS[config.autoDestino].txt });
      notificar(`⚙️ Automático: el trámite de ${e.nombres} ${e.apellidos} pasó a ${ESTADOS[config.autoDestino].txt}`);
      cambiadas.push(e);
    }
  });
  if (cambiadas.length){
    guarda("mtc_expedientes", expedientes);
    cambiadas.forEach(guardarExpedienteNube);
    auditoria.unshift({ fecha: ahora(), usuario:"Sistema", accion:"Cambios automáticos de estado aplicados" });
    guarda("mtc_auditoria", auditoria);
    if (sesion) irVista(vistaActual);
  }
}
function vistaConfig(){
  return `
    <h1 class="titulo-vista">Automatización de estados</h1>
    <div class="card" style="max-width:520px">
      <label style="display:flex;gap:10px;align-items:center;font-weight:700;margin-bottom:16px">
        <input type="checkbox" id="cfgActivo" style="width:auto" ${config.autoActivo ? "checked" : ""}>
        Activar cambio automático de estado
      </label>
      <div class="form-grid">
        <div><label>Después de (horas)</label><input id="cfgHoras" type="number" min="1" value="${config.autoHoras}"></div>
        <div><label>Cambiar a</label><select id="cfgDestino">
          <option value="aprobado" ${config.autoDestino==="aprobado"?"selected":""}>Trámite aprobado</option>
          <option value="finalizado" ${config.autoDestino==="finalizado"?"selected":""}>Trámite finalizado</option>
        </select></div>
      </div>
      <p style="font-size:12px;color:var(--gris);margin:12px 0">Ejemplo: con 24 horas, todo trámite "En proceso" pasará automáticamente a "${ESTADOS[config.autoDestino].txt}" un día después de registrarse. Siempre puedes cambiar el estado manualmente.</p>
      <button class="btn" onclick="guardarConfig()">💾 GUARDAR CONFIGURACIÓN</button>
    </div>`;
}
function guardarConfig(){
  config.autoActivo = $("cfgActivo").checked;
  config.autoHoras = Math.max(1, parseInt($("cfgHoras").value) || 24);
  config.autoDestino = $("cfgDestino").value;
  guarda("mtc_config", config);
  log(`Configuró automatización: ${config.autoActivo ? "activa" : "inactiva"}, ${config.autoHoras}h → ${ESTADOS[config.autoDestino].txt}`);
  alert("Configuración guardada.");
  motorAutomatico();
}

// ---------- Notificaciones ----------
function vistaNotifs(){
  notifs.forEach(n => n.leida = true);
  guarda("mtc_notifs", notifs);
  pintarBadge();
  return `<h1 class="titulo-vista">Notificaciones</h1>` +
    (notifs.map(n => `<div class="notif">${escapa(n.texto)}<br><small>${n.fecha}</small></div>`).join("")
    || '<p style="color:var(--gris)">No hay notificaciones.</p>');
}

// ---------- Auditoría ----------
function vistaAuditoria(){
  return `<h1 class="titulo-vista">Registro de auditoría</h1>
    <div class="card">` +
    (auditoria.map(a => `<div class="actividad"><b>${escapa(a.usuario)}</b> · ${escapa(a.accion)}<br><small>${a.fecha}</small></div>`).join("")
    || '<p style="color:var(--gris);font-size:13px">Sin registros.</p>') + `</div>`;
}

// ---------- Usuarios (admin) ----------
function vistaUsuarios(){
  const filas = usuarios.map((u,i) => `
    <tr><td><b>${escapa(u.user)}</b></td><td>${escapa(u.nombre)}</td>
    <td><span class="estado ${u.rol==="admin"?"e-observado":"e-finalizado"}">${u.rol==="admin"?"ADMIN":"OPERADOR"}</span></td>
    <td class="acciones">
      <button title="Restablecer contraseña" onclick="resetPass(${i})">🔑</button>
      ${u.user !== "admin" ? `<button title="Eliminar" onclick="delUsuario(${i})">🗑️</button>` : ""}
    </td></tr>`).join("");
  return `
    <h1 class="titulo-vista">Usuarios del sistema</h1>
    <div class="card" style="max-width:520px;margin-bottom:16px">
      <h3 style="font-size:15px;margin-bottom:10px">➕ Crear usuario</h3>
      <div class="form-grid">
        <div><label>Usuario</label><input id="uUser"></div>
        <div><label>Nombre completo</label><input id="uNombre"></div>
        <div><label>Contraseña</label><input id="uPass" type="password"></div>
        <div><label>Rol</label><select id="uRol"><option value="operador">Operador</option><option value="admin">Administrador</option></select></div>
      </div>
      <button class="btn" style="margin-top:12px" onclick="crearUsuario()">CREAR</button>
    </div>
    <div class="tabla-scroll"><table>
      <thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Acciones</th></tr></thead>
      <tbody>${filas}</tbody></table></div>`;
}
async function crearUsuario(){
  const user = $("uUser").value.trim(), nombre = $("uNombre").value.trim(), pass = $("uPass").value;
  if (!user || !nombre || pass.length < 6) return alert("Completa todo. La contraseña debe tener mínimo 6 caracteres.");
  if (usuarios.some(u => u.user === user)) return alert("Ese usuario ya existe.");
  usuarios.push({ user, nombre, rol: $("uRol").value, pass: await hash(pass) });
  guarda("mtc_usuarios", usuarios);
  log(`Creó usuario ${user} (${$("uRol").value})`);
  irVista("usuarios");
}
async function resetPass(i){
  const nueva = prompt("Nueva contraseña para " + usuarios[i].user + " (mínimo 6 caracteres):");
  if (!nueva || nueva.length < 6) return;
  usuarios[i].pass = await hash(nueva);
  guarda("mtc_usuarios", usuarios);
  log(`Restableció la contraseña de ${usuarios[i].user}`);
  alert("Contraseña actualizada.");
}
function delUsuario(i){
  if (!confirm("¿Eliminar al usuario " + usuarios[i].user + "?")) return;
  log(`Eliminó al usuario ${usuarios[i].user}`);
  usuarios.splice(i,1);
  guarda("mtc_usuarios", usuarios);
  irVista("usuarios");
}

// ---------- Copias de seguridad ----------
function vistaBackup(){
  return `
    <h1 class="titulo-vista">Copia de seguridad y portal</h1>
    <div class="card" style="max-width:520px;margin-bottom:16px;border-left:4px solid var(--rojo)">
      <h3 style="font-size:15px;margin-bottom:8px">🌐 Publicar datos al portal de clientes</h3>
      <p style="font-size:13px;color:var(--gris);margin-bottom:14px">Genera el archivo <b>datos-publicos.json</b> con los datos que el cliente ve al consultar con su DNI (nombres, tipo, estado, fechas, código y los datos de su licencia una vez emitida). No incluye teléfono, correo, dirección, fotos ni documentos. Súbelo a la misma carpeta del portal de consulta para que tus clientes vean el estado actualizado. Hazlo cada vez que cambies estados.</p>
      <button class="btn" style="width:100%" onclick="publicarPortal()">⬆️ GENERAR datos-publicos.json</button>
    </div>
    <div class="card" style="max-width:520px">
      <h3 style="font-size:15px;margin-bottom:8px">💾 Respaldo completo</h3>
      <p style="font-size:13px;color:var(--gris);margin-bottom:14px">Descarga un respaldo completo (expedientes, usuarios, auditoría y configuración) o restaura uno anterior. Recomendado: exporta una copia al final de cada día.</p>
      <button class="btn" style="width:100%;margin-bottom:10px" onclick="exportarBackup()">⬇️ DESCARGAR COPIA DE SEGURIDAD</button>
      <label style="font-size:12px;font-weight:800;color:var(--gris)">RESTAURAR DESDE ARCHIVO</label>
      <input type="file" accept=".json" onchange="importarBackup(this)">
    </div>`;
}
function publicarPortal(){
  if (!expedientes.length && !solicitudes.length) return alert("No hay trámites ni solicitudes registradas todavía.");
  const tramites = expedientes.map(e => ({
    dni: e.dni, nombres: e.nombres, apellidos: e.apellidos,
    tipo: e.tipo, estado: e.estado,
    fechaRegistro: e.fechaRegistro,
    actualizado: (e.historial && e.historial[0] ? e.historial[0].fecha : e.fechaRegistro),
    codigo: e.id.replace("E","EXP-"),
    categoria: e.categoria || "", tipoLicencia: e.tipoLicencia || "",
    restricciones: e.restricciones || "", centroEmision: e.centroEmision || "",
    numeroLicencia: e.numeroLicencia || "", fechaExpedicion: e.fechaExpedicion || "",
    vigenteHasta: e.vigenteHasta || "",
    docs: (e.docs || []).map(d => ({ nombre: d.nombre, data: d.data }))
  }));
  // Las papeletas se exportan con los datos del catálogo ya resueltos (puntos, multa, nivel)
  // porque el portal público no tiene acceso al catálogo completo, solo a este archivo.
  const papeletasPub = solicitudes.map(s => ({
    dni: s.dni, estado: s.estado,
    fechaRegistro: s.fechaRegistro, actualizado: s.actualizado,
    papeletas: (s.papeletas || []).map(p => {
      const c = catalogo[p.codigo] || {};
      return { codigo: p.codigo, nivel: c.n || "", puntos: c.p || 0, multa: c.m || 0 };
    }),
    consultaOficial: s.consultaOficial || null,
    pagoConfirmadoMs: s.pagoConfirmadoMs || null
  }));
  const publico = { tramites, papeletas: papeletasPub };
  const pesoMB = (JSON.stringify(publico).length / (1024*1024)).toFixed(1);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(publico)], {type:"application/json"}));
  a.download = "datos-publicos.json";
  a.click();
  log("Publicó datos al portal de consulta");
  alert(`Archivo generado (${pesoMB} MB).\n\nSube 'datos-publicos.json' a la misma carpeta donde está el portal de consulta (consulta-tramite.html) para que tus clientes vean los estados actualizados y puedan descargar los documentos que subiste.`);
}
function exportarBackup(){
  const data = { expedientes, usuarios, auditoria, notifs, config, plantillas, solicitudes, catalogo, cfgPap, fecha: ahora() };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:"application/json"}));
  a.download = "backup_tramites_" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  log("Descargó copia de seguridad");
}
function importarBackup(inp){
  const f = inp.files[0];
  if (!f) return;
  if (!confirm("Restaurar reemplazará TODOS los datos actuales. ¿Continuar?")) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      expedientes = d.expedientes || []; usuarios = d.usuarios || usuarios;
      auditoria = d.auditoria || []; notifs = d.notifs || []; config = d.config || config;
      if (d.plantillas) { plantillas = d.plantillas; guarda("mtc_plantillas", plantillas); }
      if (d.solicitudes) { solicitudes = d.solicitudes; guarda("mtc_solicitudes", solicitudes); solicitudes.forEach(guardarSolicitudNube); }
      if (d.catalogo) { catalogo = d.catalogo; guarda("mtc_catalogo_v2", catalogo); }
      if (d.cfgPap) { cfgPap = d.cfgPap; guarda("mtc_cfgpap", cfgPap); }
      guarda("mtc_expedientes", expedientes); guarda("mtc_usuarios", usuarios);
      guarda("mtc_auditoria", auditoria); guarda("mtc_notifs", notifs); guarda("mtc_config", config);
      expedientes.forEach(guardarExpedienteNube);
      log("Restauró copia de seguridad del " + (d.fecha || "?"));
      alert("Copia restaurada correctamente.");
      irVista("dashboard");
    } catch(e){ alert("El archivo no es una copia de seguridad válida."); }
  };
  r.readAsText(f);
}

// Enter en login
$("logPass").addEventListener("keydown", e => { if (e.key === "Enter") iniciarSesion(); });
</script>
