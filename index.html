<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Trámites</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
:root{
  --rojo:#D62828; --rojo-osc:#A31F1F; --rojo-suave:#FDECEC;
  --blanco:#FFFFFF; --fondo:#F6F4F4; --borde:#E6DEDE;
  --texto:#292222; --gris:#8B7F7F;
  --naranja:#F77F00; --verde:#1B9E4B; --azul:#2264D1;
  --sombra:0 2px 12px rgba(0,0,0,.06);
}
*{box-sizing:border-box; margin:0}
body{font-family:'Segoe UI',system-ui,sans-serif; background:var(--fondo); color:var(--texto); min-height:100vh}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:14px; width:100%; padding:11px 12px; border:1px solid var(--borde); border-radius:10px; background:#FBFAFA; outline:none; transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--rojo)}
.btn{background:var(--rojo); color:#fff; border:none; border-radius:10px; padding:12px 18px; font-weight:700; font-size:14px; letter-spacing:.5px; transition:background .2s, transform .1s}
.btn:hover{background:var(--rojo-osc)} .btn:active{transform:scale(.98)}
.btn-sec{background:#fff; color:var(--texto); border:1px solid var(--borde); border-radius:10px; padding:11px 16px; font-weight:600; font-size:13px}
.btn-sec:hover{border-color:var(--rojo); color:var(--rojo)}
.oculto{display:none!important}
.card{background:#fff; border:1px solid var(--borde); border-radius:14px; padding:20px; box-shadow:var(--sombra)}

/* ===== CONSULTA PÚBLICA (misma interfaz que consulta-tramite.html, con datos en vivo) ===== */
.panel-mtc{border:1px solid var(--borde); border-radius:12px; padding:18px 18px 8px; margin-bottom:14px; background:#fff}
.panel-mtc h2{font-size:13px; font-weight:800; letter-spacing:.5px; color:var(--rojo-osc); text-transform:uppercase; margin-bottom:14px}
.panel-mtc .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 18px}
@media(max-width:480px){.panel-mtc .grid{grid-template-columns:1fr}}
.campo-mtc{border-bottom:1px solid var(--fondo); padding-bottom:8px}
.campo-mtc .et{font-size:10.5px; color:var(--gris); text-transform:uppercase; letter-spacing:.5px; font-weight:700}
.campo-mtc .val{font-size:14px; font-weight:600; margin-top:3px}
.tramite-card{border:1px solid var(--borde); border-radius:12px; padding:16px; margin-bottom:12px; border-left:5px solid var(--gris)}
.tramite-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap}
.tramite-card .tipo{font-weight:800; font-size:15px}
.tramite-card .meta{font-size:12px; color:var(--gris); margin-top:4px}
.estado-pill{display:inline-block; padding:5px 12px; border-radius:20px; font-size:11px; font-weight:800; letter-spacing:.5px; color:#fff; white-space:nowrap}
.e-tramite{background:var(--naranja)} .e-aprobado{background:var(--verde)}
.e-observado{background:var(--rojo)} .e-finalizado{background:var(--azul)}
.docs-box{margin-top:12px; padding-top:12px; border-top:1px dashed var(--borde)}
.docs-box .et{font-size:10.5px; color:var(--gris); text-transform:uppercase; letter-spacing:.5px; font-weight:700; margin-bottom:8px; display:block}
.doc-link{display:flex; align-items:center; gap:10px; background:var(--rojo-suave); border:1px solid var(--borde); border-radius:10px; padding:10px 12px; margin-bottom:8px; text-decoration:none; color:var(--texto)}
.doc-link:hover{background:#fbdada}
.doc-link .ic{font-size:20px}
.doc-link .nom{font-size:13px; font-weight:700; word-break:break-all}
.doc-link .accion{margin-left:auto; font-size:11px; font-weight:800; color:var(--rojo-osc); white-space:nowrap}
.carga-box{margin-top:12px}
.carga-box .txt{font-size:11px; color:var(--gris); font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:6px}
.carga-barra{height:10px; border-radius:20px; background:var(--fondo); overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.carga-barra .relleno{height:100%; border-radius:20px; width:0%;
  background:linear-gradient(90deg,#F77F00,#FFB066,#F77F00); background-size:200% 100%;
  animation:cargaAvance 7s ease-in-out infinite, cargaBrillo 1.6s linear infinite}
@keyframes cargaAvance{0%{width:3%} 75%{width:90%} 100%{width:3%}}
@keyframes cargaBrillo{0%{background-position:0% 0} 100%{background-position:200% 0}}
.tabs-consulta{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab-consulta{background:#fff;color:var(--texto);border:1px solid var(--borde);border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px}
.tab-consulta.activo{background:var(--rojo);color:#fff;border-color:var(--rojo)}

/* ===== LOGIN ===== */
#pantallaLogin{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:linear-gradient(135deg, var(--rojo) 0%, var(--rojo-osc) 100%)}
.login-box{background:#fff; border-radius:18px; padding:36px 28px; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,.25); animation:sube .4s ease}
@keyframes sube{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
.login-box h1{font-size:24px; font-weight:900; letter-spacing:2px; color:var(--rojo); text-align:center}
.login-box .sub{text-align:center; color:var(--gris); font-size:12px; letter-spacing:2px; text-transform:uppercase; margin:4px 0 24px}
.login-box label{font-size:12px; font-weight:700; color:var(--gris); display:block; margin:12px 0 6px; letter-spacing:1px}
.check-linea{display:flex; align-items:center; justify-content:space-between; margin:14px 0 18px; font-size:13px}
.check-linea label{margin:0; display:flex; align-items:center; gap:6px; font-weight:600; color:var(--texto)}
.check-linea input{width:auto}
.link{color:var(--rojo); font-weight:600; font-size:13px; background:none; border:none; text-decoration:underline}
.msg-login{text-align:center; font-size:13px; font-weight:700; margin-top:12px; min-height:18px}

/* ===== ENCABEZADO INSTITUCIONAL ===== */
#headerMTC{background:var(--rojo-osc); color:#fff; padding:0 22px}
#headerMTC .hm-top{display:flex; align-items:center; gap:10px; padding:9px 0; flex-wrap:wrap}
#headerMTC .hm-marca{font-weight:900; letter-spacing:1px; font-size:14px; display:flex; align-items:center; gap:8px}
#headerMTC .hm-marca .tag{background:#fff; color:var(--rojo-osc); font-size:10px; font-weight:900; padding:2px 8px; border-radius:5px; letter-spacing:1px}
#headerMTC .hm-sub{font-size:11px; opacity:.85; flex:1; min-width:180px}
#headerMTC .hm-pdf{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
#headerMTC .hm-pdf input{width:150px; padding:7px 10px; font-size:12px; border-radius:8px 0 0 8px; border:none}
#headerMTC .hm-pdf button{background:#fff; color:var(--rojo-osc); border:none; border-radius:0 8px 8px 0; padding:7px 12px; font-weight:800; font-size:12px}
#headerMTC .hm-pdf button:hover{background:#FDECEC}
#headerMTC .hm-crumb{font-size:11px; opacity:.8; padding:5px 0 8px; border-top:1px solid rgba(255,255,255,.15)}
#headerMTC .hm-msg{font-size:11px; font-weight:700; width:100%; padding-bottom:6px}
@media(max-width:600px){#headerMTC .hm-pdf input{width:120px}}

/* ===== LAYOUT ===== */
#app{display:flex; flex-direction:column; min-height:100vh}
#appCuerpo{display:flex; flex:1; min-height:0; align-items:flex-start}
aside{width:230px; flex:0 0 230px; background:#fff; border-right:1px solid var(--borde); padding:20px 12px; position:sticky; top:0; max-height:100vh; overflow-y:auto; z-index:20; transition:transform .25s}
aside .logo{font-size:18px; font-weight:900; letter-spacing:2px; color:var(--rojo); padding:0 10px 16px; border-bottom:2px solid var(--rojo-suave); margin-bottom:14px}
aside button.nav{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none; padding:11px 12px; border-radius:10px; font-size:14px; font-weight:600; color:var(--texto); margin-bottom:2px; transition:background .15s}
aside button.nav:hover{background:var(--rojo-suave)}
aside button.nav.activo{background:var(--rojo); color:#fff}
aside .seccion{font-size:10px; letter-spacing:2px; color:var(--gris); font-weight:800; padding:14px 12px 6px; text-transform:uppercase}
main{flex:1; padding:22px; min-width:0}
.topbar{display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap}
.topbar .buscador{flex:1; min-width:180px; position:relative}
.topbar .buscador input{padding-left:38px}
.topbar .buscador::before{content:"🔎"; position:absolute; left:12px; top:11px; font-size:14px}
.usuario-chip{background:#fff; border:1px solid var(--borde); border-radius:20px; padding:8px 14px; font-size:13px; font-weight:700; display:flex; gap:8px; align-items:center}
.usuario-chip .rol{font-size:10px; background:var(--rojo-suave); color:var(--rojo); padding:2px 8px; border-radius:10px; letter-spacing:1px}
#btnMenu{display:none; background:var(--rojo); color:#fff; border:none; border-radius:10px; padding:10px 14px; font-size:16px}

/* ===== DASHBOARD ===== */
.tarjetas{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:20px}
.tarjeta{background:#fff; border:1px solid var(--borde); border-radius:14px; padding:18px; box-shadow:var(--sombra); border-top:4px solid var(--gris); transition:transform .15s}
.tarjeta:hover{transform:translateY(-3px)}
.tarjeta .num{font-size:30px; font-weight:900}
.tarjeta .lbl{font-size:12px; color:var(--gris); font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-top:4px}
.t-total{border-top-color:var(--rojo)} .t-proceso{border-top-color:var(--naranja)}
.t-aprobado{border-top-color:var(--verde)} .t-observado{border-top-color:var(--rojo)} .t-final{border-top-color:var(--azul)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.stat-fila{display:flex; align-items:center; gap:10px; margin:10px 0}
.stat-fila .barra{flex:1; height:10px; background:var(--fondo); border-radius:6px; overflow:hidden}
.stat-fila .barra div{height:100%; background:var(--rojo); border-radius:6px; transition:width .5s}
.stat-fila span{font-size:12px; font-weight:700; min-width:110px}
.actividad{font-size:13px; padding:9px 0; border-bottom:1px solid var(--fondo)}
.actividad small{color:var(--gris)}

/* ===== TABLA ===== */
.filtros{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.filtros>*{flex:1; min-width:130px}
table{width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; box-shadow:var(--sombra); font-size:13px}
th{background:var(--rojo); color:#fff; text-align:left; padding:12px 10px; font-size:12px; letter-spacing:1px}
td{padding:11px 10px; border-bottom:1px solid var(--fondo); vertical-align:middle}
tr:hover td{background:#FDF9F9}
.tabla-scroll{overflow-x:auto; border-radius:14px}
.estado{display:inline-block; padding:5px 12px; border-radius:20px; font-size:11px; font-weight:800; letter-spacing:.5px; color:#fff; white-space:nowrap}
.e-tramite{background:var(--naranja)} .e-aprobado{background:var(--verde)}
.e-observado{background:var(--rojo)} .e-finalizado{background:var(--azul)}
.acciones button{background:none; border:1px solid var(--borde); border-radius:8px; padding:6px 9px; margin:1px; font-size:13px}
.acciones button:hover{border-color:var(--rojo)}

/* ===== MODAL ===== */
.modal-fondo{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; z-index:50; overflow-y:auto; animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff; border-radius:16px; padding:24px; width:100%; max-width:640px; animation:sube .25s ease}
.modal h2{font-size:18px; color:var(--rojo); margin-bottom:16px}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.form-grid .full{grid-column:1/-1}
.form-grid label{font-size:11px; font-weight:800; color:var(--gris); letter-spacing:1px; display:block; margin-bottom:4px; text-transform:uppercase}
.caja-scan{background:var(--rojo-suave); border:1px dashed var(--rojo); border-radius:10px; padding:12px 14px; margin-bottom:14px}
.caja-scan label{color:var(--rojo-osc)}
.caja-scan p{font-size:11.5px; color:var(--gris); margin:4px 0 8px}
.caja-scan input[type=file]{background:#fff; padding:9px}
.caja-scan .msg-scan{font-size:12px; font-weight:700; margin-top:8px; min-height:16px}
.scan-dos-caras{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.scan-dos-caras label{display:block; margin-bottom:3px; font-weight:800; color:var(--rojo-osc)}
/* Overlay circular de pantalla completa mientras el lector procesa la imagen subida */
.scan-overlay-fondo{position:fixed; inset:0; z-index:9999; background:rgba(20,15,15,.72); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; animation:apareceFondo .2s ease}
@keyframes apareceFondo{from{opacity:0} to{opacity:1}}
.scan-overlay-tarjeta{position:relative; width:min(300px,80vw); min-height:190px; background:var(--rojo-osc); border-radius:16px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.4)}
.scan-overlay-img{width:100%; height:min(300px,60vw); object-fit:cover; display:block; filter:brightness(.45) blur(.5px)}
.scan-overlay-spinner{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px}
.scan-ring-wrap{position:relative; width:92px; height:92px; display:flex; align-items:center; justify-content:center}
.scan-ring{position:absolute; inset:0; border-radius:50%; border:5px solid rgba(255,255,255,.28); border-top-color:#fff; animation:scanGirar .85s linear infinite}
.scan-ring-label{position:relative; color:#fff; font-weight:900; font-style:italic; font-size:13px; letter-spacing:2px; text-shadow:0 1px 3px rgba(0,0,0,.4)}
.scan-ring-sub{color:#fff; font-weight:600; font-size:11px; opacity:.85; text-shadow:0 1px 3px rgba(0,0,0,.4)}
@keyframes scanGirar{to{transform:rotate(360deg)}}
.modal-botones{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap}
.modal-botones .btn, .modal-botones .btn-sec{flex:1}
.doc-item{display:flex; justify-content:space-between; align-items:center; background:var(--fondo); border-radius:8px; padding:8px 12px; margin:6px 0; font-size:13px}
.hist-item{font-size:12px; padding:6px 0; border-bottom:1px solid var(--fondo); color:var(--gris)}
.notif{background:#fff; border-left:4px solid var(--rojo); border-radius:10px; padding:12px 14px; margin-bottom:8px; box-shadow:var(--sombra); font-size:13px}
.notif small{color:var(--gris)}
h1.titulo-vista{font-size:22px; font-weight:900; margin-bottom:16px}
.pill-conteo{background:var(--rojo-suave); color:var(--rojo); border-radius:14px; padding:2px 10px; font-size:12px; font-weight:800; margin-left:8px}

/* ===== RESPONSIVE ===== */
@media(max-width:820px){
  #headerMTC .hm-pdf, #headerMTC .hm-sub{display:none}
  aside{position:fixed; top:0; bottom:0; max-height:none; transform:translateX(-100%)}
  aside.abierto{transform:none; box-shadow:0 0 40px rgba(0,0,0,.3)}
  main{padding:14px}
  #btnMenu{display:block}
}
@media print{
  #headerMTC,aside,.topbar,.filtros,.acciones,#btnMenu,.modal-botones{display:none!important}
  main{margin:0}
  body{background:#fff}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="pantallaLogin">
  <div class="login-box">
    <h1>GESTIÓN MTC</h1>
    <p class="sub">Sistema de trámites administrativos</p>
    <label>USUARIO</label>
    <input id="logUser" placeholder="Nombre de usuario" autocomplete="username">
    <label>CONTRASEÑA</label>
    <input id="logPass" type="password" placeholder="••••••••" autocomplete="current-password">
    <div class="check-linea">
      <label><input type="checkbox" id="logRecordar"> Recordar sesión</label>
      <button class="link" onclick="recuperarPass()">¿Olvidaste tu contraseña?</button>
    </div>
    <button class="btn" style="width:100%" onclick="iniciarSesion()">INICIAR SESIÓN</button>
    <p class="msg-login" id="msgLogin"></p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="oculto">
  <div id="headerMTC">
    <div class="hm-top">
      <div class="hm-marca" id="hmMarca"></div>
      <div class="hm-sub">Gestión y asesoría de trámites — empresa privada, no somos una entidad del Estado</div>
      <div class="hm-pdf">
        <input id="hmDni" maxlength="8" inputmode="numeric" placeholder="DNI del cliente">
        <button onclick="generarPDFdesdeHeader()">📥 Generar PDF de constancia</button>
      </div>
      <div class="hm-msg" id="hmMsg"></div>
    </div>
    <div class="hm-crumb" id="breadcrumbMTC">Inicio</div>
  </div>
  <div id="appCuerpo">
  <aside id="menuLateral">
    <div class="logo">GESTIÓN MTC</div>
    <button class="nav activo" data-vista="dashboard" onclick="irVista('dashboard')">📊 Panel principal</button>
    <div class="seccion">Módulos</div>
    <button class="nav" data-vista="nueva" onclick="irVista('nueva')">🪪 Nueva licencia</button>
    <button class="nav" data-vista="revalidacion" onclick="irVista('revalidacion')">🔄 Revalidación</button>
    <button class="nav" data-vista="recategorizacion" onclick="irVista('recategorizacion')">⬆️ Recategorización</button>
    <button class="nav" data-vista="retenciones" onclick="irVista('retenciones')">📌 Retenciones</button>
    <button class="nav" data-vista="todos" onclick="irVista('todos')">📁 Todos los trámites</button>
    <button class="nav" data-vista="consulta" onclick="irVista('consulta')">🔍 Consulta pública</button>
    <button class="nav" data-vista="centros" onclick="irVista('centros')">🏫 Centros de Evaluación</button>
    <button class="nav" data-vista="papeletas" onclick="irVista('papeletas')">🚦 Eliminación de papeletas</button>
    <div class="seccion">Sistema</div>
    <button class="nav" data-vista="notificaciones" onclick="irVista('notificaciones')">🔔 Notificaciones <span id="badgeNotif" class="pill-conteo oculto">0</span></button>
    <button class="nav" data-vista="auditoria" onclick="irVista('auditoria')">📜 Auditoría</button>
    <button class="nav soloAdmin" data-vista="usuarios" onclick="irVista('usuarios')">👥 Usuarios</button>
    <button class="nav soloAdmin" data-vista="config" onclick="irVista('config')">⚙️ Automatización</button>
    <button class="nav soloAdmin" data-vista="plantillas" onclick="irVista('plantillas')">📄 Administrador de plantillas</button>
    <button class="nav soloAdmin" data-vista="backup" onclick="irVista('backup')">💾 Respaldo y portal</button>
    <button class="nav" onclick="cerrarSesion()" style="color:var(--rojo)">🚪 Cerrar sesión</button>
  </aside>

  <main>
    <div class="topbar">
      <button id="btnMenu" onclick="document.getElementById('menuLateral').classList.toggle('abierto')">☰</button>
      <div class="buscador"><input id="buscadorGlobal" placeholder="Buscar por DNI, nombre o apellido…" oninput="busquedaGlobal()"></div>
      <div class="usuario-chip">👤 <span id="chipNombre"></span> <span class="rol" id="chipRol"></span></div>
    </div>
    <div id="contenido"></div>
  </main>
  </div>
</div>

<div id="zonaModal"></div>

<script>
/* =================================================================
   SISTEMA DE GESTIÓN DE TRÁMITES MTC · Un solo archivo
   Datos en localStorage · Contraseñas cifradas con SHA-256
   ================================================================= */

// solo con los datos guardados en este dispositivo — nubeConectada queda en false y las
// funciones de sincronización no hacen nada.
const firebaseConfig = {
  apiKey: "AIzaSyA6VtplK2yA0jarjEcLz1Y4PT7EsA_zaDA",
  authDomain: "mtc-gestion-666ee.firebaseapp.com",
  projectId: "mtc-gestion-666ee",

  messagingSenderId: "362415983939",
  appId: "1:362415983939:web:34a7b127a00c190d1e73f6"
};
let nubeConectada = false;
let dbCloud = null;
try{
  if (typeof firebase !== "undefined"){
    firebase.initializeApp(firebaseConfig);
    dbCloud = firebase.firestore();
    firebase.auth().signInAnonymously().catch(err => console.error("Firebase auth:", err));
    firebase.auth().onAuthStateChanged(user => {
      if (user && !nubeConectada){
        nubeConectada = true;
        iniciarSincronizacionNube();
      }
    });
  }
}catch(_e){ /* sin nube, el sistema sigue funcionando solo en este dispositivo */ }

async function iniciarSincronizacionNube(){
  // Primera vez: si la nube está vacía pero este dispositivo ya tiene datos guardados
  // localmente, se suben una sola vez para no perderlos (en vez de que la nube vacía los borre
  // de la pantalla).
  try{
    const [snapExp, snapSol] = await Promise.all([
      dbCloud.collection("expedientes").limit(1).get(),
      dbCloud.collection("solicitudes").limit(1).get()
    ]);
    if (snapExp.empty && expedientes.length) await Promise.all(expedientes.map(e => dbCloud.collection("expedientes").doc(e.id).set(e)));
    if (snapSol.empty && solicitudes.length) await Promise.all(solicitudes.map(s => dbCloud.collection("solicitudes").doc(s.id).set(s)));
  }catch(err){ console.error("Migración inicial a la nube:", err); }

  dbCloud.collection("expedientes").onSnapshot(snap => {
    expedientes = snap.docs.map(d => d.data()).sort((a,b) => (b.registroMs||0) - (a.registroMs||0));
    guarda("mtc_expedientes", expedientes);
    if (sesion) irVista(vistaActual);
  }, err => console.error("Firestore expedientes:", err));

  dbCloud.collection("solicitudes").onSnapshot(snap => {
    solicitudes = snap.docs.map(d => d.data()).sort((a,b) => (b.creadoMs||0) - (a.creadoMs||0));
    guarda("mtc_solicitudes", solicitudes);
    if (sesion) irVista(vistaActual);
  }, err => console.error("Firestore solicitudes:", err));
}
function guardarExpedienteNube(e){ if (nubeConectada && e) dbCloud.collection("expedientes").doc(e.id).set(e).catch(err => console.error("Guardar expediente en la nube:", err)); }
function eliminarExpedienteNube(id){ if (nubeConectada) dbCloud.collection("expedientes").doc(id).delete().catch(err => console.error("Eliminar expediente en la nube:", err)); }
function guardarSolicitudNube(s){ if (nubeConectada && s) dbCloud.collection("solicitudes").doc(s.id).set(s).catch(err => console.error("Guardar solicitud en la nube:", err)); }
function eliminarSolicitudNube(id){ if (nubeConectada) dbCloud.collection("solicitudes").doc(id).delete().catch(err => console.error("Eliminar solicitud en la nube:", err)); }

}

async function hash(txt){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}

function log(accion){
  auditoria.unshift({ fecha: ahora(), usuario: sesion ? sesion.nombre : "sistema", accion });
  if (auditoria.length > 500) auditoria.pop();
  guarda("mtc_auditoria", auditoria);
}
function notificar(texto){
  notifs.unshift({ fecha: ahora(), texto, leida:false });
  if (notifs.length > 100) notifs.pop();
  guarda("mtc_notifs", notifs);
  pintarBadge();
}
function pintarBadge(){
  const n = notifs.filter(x => !x.leida).length;
  const b = $("badgeNotif");
  if (!b) return;
  b.textContent = n;
  b.classList.toggle("oculto", n === 0);
}

// ---------- Login ----------
async function iniciarSesion(){
  const u = $("logUser").value.trim(), p = $("logPass").value;
  const msg = $("msgLogin");
  const enc = usuarios.find(x => x.user === u);
  if (!enc || enc.pass !== await hash(p)){
    msg.style.color = "var(--rojo)";
    msg.textContent = "Usuario o contraseña incorrectos.";
    return;
  }
  if ($("logRecordar").checked) guarda("mtc_sesion", { user:u });
  entrar(u);
  log("Inició sesión");
}
function entrar(userName){
  const u = usuarios.find(x => x.user === userName);
  if (!u) return;
  sesion = u;
  $("pantallaLogin").classList.add("oculto");
  $("app").classList.remove("oculto");
  $("chipNombre").textContent = u.nombre;
  $("chipRol").textContent = u.rol === "admin" ? "ADMIN" : "OPERADOR";
  document.querySelectorAll(".soloAdmin").forEach(b => b.classList.toggle("oculto", u.rol !== "admin"));
  pintarBadge();
  irVista("dashboard");
}
function cerrarSesion(){
  log("Cerró sesión");
  localStorage.removeItem("mtc_sesion");
  sesion = null;
  $("app").classList.add("oculto");
  $("pantallaLogin").classList.remove("oculto");
  $("logPass").value = "";
}

function irVista(v){
  vistaActual = v;
  document.querySelectorAll("aside .nav").forEach(b => b.classList.toggle("activo", b.dataset.vista === v));
  $("menuLateral").classList.remove("abierto");
  const bc = $("breadcrumbMTC");
  if (bc) bc.textContent = "Inicio" + (v === "dashboard" ? "" : " › " + (VISTA_LABELS[v] || v));
  const c = $("contenido");
  if (v === "dashboard")            c.innerHTML = vistaDashboard();
  else if (TIPOS[v] || v === "todos"){ c.innerHTML = vistaModulo(v); pintarTabla(); }
  else if (v === "notificaciones")  c.innerHTML = vistaNotifs();
  else if (v === "auditoria")       c.innerHTML = vistaAuditoria();
  else if (v === "usuarios")        c.innerHTML = vistaUsuarios();
  else if (v === "config")          c.innerHTML = vistaConfig();
  else if (v === "consulta")        c.innerHTML = vistaConsulta();
  else if (v === "centros"){ c.innerHTML = vistaCentrosEvaluacion(); buscarCentrosCE(); }
  else if (v === "papeletas"){ c.innerHTML = vistaPapeletas(); pintarPapeletas(); }
  else if (v === "plantillas")      c.innerHTML = vistaPlantillas();
  else if (v === "backup")          c.innerHTML = vistaBackup();
}

// ---------- Dashboard ----------
function cuenta(estado){ return expedientes.filter(e => e.estado === estado).length; }
function vistaDashboard(){
  const total = expedientes.length;
  const porTipo = Object.keys(TIPOS).map(t => {
    const n = expedientes.filter(e => e.tipo === t).length;
    const pct = total ? Math.round(n/total*100) : 0;
    return `<div class="stat-fila"><span>${TIPOS[t]}</span><div class="barra"><div style="width:${pct}%"></div></div><b style="font-size:13px">${n}</b></div>`;
  }).join("");

// ---------- Lector de DNI (OCR en el navegador) ----------
function parsearDNI(texto){
  const limpio = String(texto || "").replace(/\r/g, "");
  const lineas = limpio.split("\n").map(l => l.trim()).filter(Boolean);
  const resultado = { dni: "", nombres: "", apellidos: "", direccion: "" };

  // Intento 1: zona MRZ (líneas con varios "<", presentes en el reverso del DNI).
  // El DNI peruano usa el formato TD1: son 3 líneas y los nombres SIEMPRE van en la
  // última — buscar "la primera línea con <<" fallaba porque la línea del número de
  // documento también tiene "<<" (son puros símbolos de relleno).
  const mrz = lineas.filter(l => (l.match(/</g) || []).length >= 5);
  if (mrz.length){
    const lineaNombres = mrz[mrz.length - 1];
    if (lineaNombres && lineaNombres.includes("<<")){
      const partes = lineaNombres.split("<<").map(p => p.replace(/</g, " ").trim()).filter(Boolean);
      if (partes[0]) resultado.apellidos = partes[0];
      if (partes[1]) resultado.nombres = partes[1];
    }
    const lineaDoc = mrz.find(l => /\d{8}/.test(l));
    if (lineaDoc){ const m = lineaDoc.match(/\d{8}/); if (m) resultado.dni = m[0]; }
  }

  // Intento 2: etiquetas típicas del anverso del DNI peruano
  // Busca el valor en la misma línea de la etiqueta (después de ":") o en las líneas siguientes,
  // saltando líneas vacías o que sean a su vez otra etiqueta.
  const OTRA_ETIQUETA = /APELLIDO|PRENOMBRE|NOMBRE|DOCUMENTO|N[°º]|SEXO|NACIONALIDAD|FECHA|NACIMIENTO|ESTATURA|DNI/i;
  function valorTrasEtiqueta(idxEtiqueta, regexEtiqueta){
    const lineaEtiqueta = lineas[idxEtiqueta];
    const m = lineaEtiqueta.match(regexEtiqueta);
    // Solo se toma como valor lo que viene DESPUÉS de la etiqueta en la misma línea
    // (si hubiera ruido de OCR antes de la etiqueta, como "Cul Primer Apellido", se ignora).
    if (m){
      const despues = lineaEtiqueta.slice(m.index + m[0].length).replace(/^[:\-\s]+/, "").trim();
      if (despues.length >= 2 && !OTRA_ETIQUETA.test(despues)) return despues;
    }
    for (let j = idxEtiqueta + 1; j <= idxEtiqueta + 2 && j < lineas.length; j++){
      const l = lineas[j];
      if (!l || l.length < 2 || OTRA_ETIQUETA.test(l)) continue;
      return l;
    }
    return "";
  }
  const idx = re => lineas.findIndex(l => re.test(l));
  const reApPrimer = /PRIMER\s*APELLIDO|APELLIDO\s*PATERNO/i;
  const reApSegundo = /SEGUNDO\s*APELLIDO|APELLIDO\s*MATERNO/i;
  const reNombres = /PRENOMBRES|NOMBRES/i;
  const iPat = idx(reApPrimer);
  const iMat = idx(reApSegundo);
  if (!resultado.apellidos){
    const pat = iPat >= 0 ? valorTrasEtiqueta(iPat, reApPrimer) : "";
    const mat = iMat >= 0 ? valorTrasEtiqueta(iMat, reApSegundo) : "";
    resultado.apellidos = [pat, mat].filter(Boolean).join(" ").trim();
  }
  if (!resultado.nombres){
    const iNom = idx(reNombres);
    if (iNom >= 0) resultado.nombres = valorTrasEtiqueta(iNom, reNombres);
    // A veces el OCR pierde por completo la etiqueta "Prenombres"; como en el DNI
    // siempre va justo después del segundo apellido, se busca ahí como respaldo.
    if (!resultado.nombres && iMat >= 0){
      for (let j = iMat + 1; j <= iMat + 3 && j < lineas.length; j++){
        const l = lineas[j];
        if (!l || l.length < 3 || OTRA_ETIQUETA.test(l)) continue;
        if (l === resultado.apellidos || (resultado.apellidos && resultado.apellidos.includes(l))) continue;
        resultado.nombres = l;
        break;
      }
    }
  }
  if (!resultado.dni){
    const m = limpio.match(/\b\d{8}\b/);
    if (m) resultado.dni = m[0];
  }

  // Dirección: hay dos formatos posibles.
  // 1) Reverso del DNI físico: "Dirección" (la calle) + "Departamento / Provincia / Distrito" juntos.
  // 2) Ficha RENIEC de consultas en línea: "Dirección:" + "Departamento de Domicilio:",
  //    "Provincia de Domicilio:" y "Distrito de Domicilio:" en líneas separadas — y esta ficha
  //    TAMBIÉN tiene "Departamento/Provincia/Distrito de Nacimiento", así que hay que anclar
  //    la búsqueda al inicio de línea para no mezclar nacimiento con domicilio, ni confundir
  //    "Departamento de Domicilio" con la etiqueta "Dirección" (ambas contienen "domicilio").
  const RE_DIRECCION = /^(DOMICILIO|DIRECCI[OÓ]N)\b/i;
  const RE_UBICACION_JUNTA = /DEPARTAMENTO\s*\/?\s*PROVINCIA\s*\/?\s*DISTRITO/i;
  const RE_DEPTO_DOM = /^DEPARTAMENTO\s*DE\s*DOMICILIO/i;
  const RE_PROV_DOM = /^PROVINCIA\s*DE\s*DOMICILIO/i;
  const RE_DIST_DOM = /^DISTRITO\s*DE\s*DOMICILIO/i;
  // "Índice Derecho/Izquierdo" o "Huella Derecha/Izquierda" es el texto fijo bajo la huella
  // digital (el género cambia según a qué palabra acompaña): como queda a la misma altura
  // que los datos de ubicación, el OCR a veces los junta en una sola línea. Estas palabras
  // casi nunca aparecen en una dirección real, así que si el OCR las detecta se quitan junto
  // con la palabra que tengan pegada antes (normalmente "Índice"/"Huella", aunque a veces se
  // lee mal como otra cosa, ej. "mica Derecho").
  const RE_HUELLA = /(?:\S+\s+)?\b(DERECH[OA]|IZQUIERD[OA])\b/gi;
  const limpiaBoilerplate = t => String(t || "").replace(RE_HUELLA, "").replace(/\s{2,}/g, " ").trim();
  // Departamento/provincia/distrito son siempre palabras completas en mayúscula; cualquier
  // resto suelto en minúscula o símbolo que el OCR pegue al final (fragmento de la siguiente
  // etiqueta, borde de tabla mal leído, etc.) se descarta.
  const limpiaUbicacion = t => String(t || "").split(/\s+/)
    .map(w => w.replace(/[^A-ZÑÁÉÍÓÚa-zñáéíóú]/g, ""))
    .filter(w => w.length >= 2 && /^[A-ZÑÁÉÍÓÚ]+$/.test(w))
    .join(" ").trim();

  const iDir = idx(RE_DIRECCION);
  const calle = iDir >= 0 ? limpiaBoilerplate(valorTrasEtiqueta(iDir, RE_DIRECCION)) : "";

  const iUbicJunta = idx(RE_UBICACION_JUNTA);
  const ubicacionJunta = iUbicJunta >= 0 ? limpiaBoilerplate(valorTrasEtiqueta(iUbicJunta, RE_UBICACION_JUNTA)).replace(/\//g, ", ") : "";

  const iDepto = idx(RE_DEPTO_DOM), iProv = idx(RE_PROV_DOM), iDist = idx(RE_DIST_DOM);
  const depto = iDepto >= 0 ? limpiaUbicacion(limpiaBoilerplate(valorTrasEtiqueta(iDepto, RE_DEPTO_DOM))) : "";
  const prov = iProv >= 0 ? limpiaUbicacion(limpiaBoilerplate(valorTrasEtiqueta(iProv, RE_PROV_DOM))) : "";
  const dist = iDist >= 0 ? limpiaUbicacion(limpiaBoilerplate(valorTrasEtiqueta(iDist, RE_DIST_DOM))) : "";
  const ubicacionSeparada = [depto, prov, dist].filter(Boolean).join(", ");

  resultado.direccion = [calle, ubicacionJunta || ubicacionSeparada].filter(Boolean).join(", ");

  // Solo conserva palabras completamente en mayúsculas (así se imprimen los nombres en el DNI);
  // descarta ruido suelto (letras erráticas, marcas de agua mal leídas) que no cumpla ese patrón.
  const limpiaNombre = t => String(t || "").split(/\s+/)
    .map(w => w.replace(/[^A-ZÑÁÉÍÓÚa-zñáéíóú]/g, ""))
    .filter(w => w.length >= 2 && /^[A-ZÑÁÉÍÓÚ]+$/.test(w))
    .join(" ").trim();
  resultado.nombres = limpiaNombre(resultado.nombres);
  resultado.apellidos = limpiaNombre(resultado.apellidos);
  resultado.direccion = String(resultado.direccion || "").replace(/[^A-Za-z0-9\sÑñÁÉÍÓÚáéíóú.,#\-\/°]/g, "").replace(/\s+/g, " ").trim();
  return resultado;
}

// Reconstruye el texto usando la posición real de cada palabra en la imagen: agrupa por línea
// según su altura y descarta la franja derecha (donde suele estar la foto) y palabras de baja
// confianza (ruido de fondo, marcas de agua). Esto evita que el OCR mezcle columnas distintas.
function reconstruirPorPosicion(data, anchoImagen, sinLimiteX){
  const palabrasOrig = (data && data.words) || [];
  if (!anchoImagen || !palabrasOrig.length) return null;
  const limiteX = anchoImagen * 0.6;
  const palabras = palabrasOrig.filter(w => w.bbox && (sinLimiteX || w.bbox.x0 < limiteX) && (w.confidence == null || w.confidence > 35));
  if (!palabras.length) return null;
  palabras.sort((a, b) => a.bbox.y0 - b.bbox.y0);
  const lineas = [];
  palabras.forEach(w => {
    const cy = (w.bbox.y0 + w.bbox.y1) / 2;
    const altura = w.bbox.y1 - w.bbox.y0;
    let linea = lineas.find(l => Math.abs(l.cy - cy) < altura * 0.7);
    if (!linea){ linea = { cy, palabras: [] }; lineas.push(linea); }
    linea.palabras.push(w);
  });
  lineas.sort((a, b) => a.cy - b.cy);
  return lineas.map(l => l.palabras.sort((a, b) => a.bbox.x0 - b.bbox.x0).map(w => w.text).join(" ")).join("\n");
}

// Mejora la imagen antes de leerla: pasa a escala de grises y sube el contraste, para separar
// mejor el texto de fondos con marca de agua/textura (como el papel de seguridad del DNI).
// Si algo falla, se usa la imagen original tal cual.
async function preprocesarImagen(file, sinContraste){
  try{
    const bmp = await createImageBitmap(file);
    let w = bmp.width, h = bmp.height;
    const ESCALA_MIN = 1600;
    let factor = 1;
    if (w < ESCALA_MIN) factor = ESCALA_MIN / w;
    w = Math.round(w * factor); h = Math.round(h * factor);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    // El contraste centrado en gris medio ayuda con el papel de seguridad del DNI físico, pero
    // en una captura de pantalla (texto de colores sobre fondo blanco, sin textura) puede volver
    // casi invisibles colores cuyo gris equivalente cae cerca de ese punto medio (como el
    // naranja). Para capturas de pantalla se salta este paso y solo se agranda la imagen.
    if (!sinContraste){
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      const contraste = 1.5;
      for (let i = 0; i < d.length; i += 4){
        const gris = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const v = Math.max(0, Math.min(255, (gris - 128) * contraste + 128));
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      ctx.putImageData(imgData, 0, 0);
    }
    return await new Promise(resolve => {
      canvas.toBlob(blob => resolve(blob ? new File([blob], file.name, { type: "image/png" }) : file), "image/png");
    });
  }catch(_e){
    return file;
  }
}

// Recorta la foto del ciudadano de la ficha RENIEC usando como referencia la posición de las
// etiquetas "FOTO DEL CIUDADANO" (inicio del recorte) y "FIRMA DEL CIUDADANO" (fin del recorte).
// Se recorta siempre de la imagen ORIGINAL (a color), nunca de la versión en escala de grises
// que se usa para leer el texto. "factorEscala" corrige que esa versión para OCR puede estar
// agrandada respecto a la original.
async function recortarFotoFicha(data, archivoOriginal, factorEscala){
  try{
    const lineas = data.lines || [];
    const lineaFoto = lineas.find(l => /FOTO/i.test(l.text) && /CIUDADANO/i.test(l.text));
    if (!lineaFoto || !lineaFoto.bbox) return null;
    const lineaFirma = lineas.find(l => /FIRMA/i.test(l.text));
    const bmp = await createImageBitmap(archivoOriginal);
    const esc = factorEscala || 1;
    const yInicio = Math.max(0, Math.round(lineaFoto.bbox.y1 / esc));
    const yFinDefecto = Math.min(bmp.height, yInicio + Math.round(bmp.height * 0.32));
    const yFinFirma = (lineaFirma && lineaFirma.bbox) ? Math.round(lineaFirma.bbox.y0 / esc) : 0;
    const yFin = yFinFirma > yInicio ? yFinFirma : yFinDefecto;
    const h = yFin - yInicio;
    const xInicio = Math.max(0, Math.round(lineaFoto.bbox.x0 / esc) - Math.round(bmp.width * 0.02));
    // Las fotos tipo carné son más altas que anchas (proporción aprox. 3:4). Antes se recortaba
    // hasta el borde derecho de toda la imagen escaneada, lo que agarraba de más (borde de la
    // hoja, columna vecina, etc.) cuando la etiqueta "Foto del Ciudadano" no estaba pegada al
    // borde izquierdo real de la foto. Ahora el ancho se estima a partir de esa proporción.
    const anchoEstimado = Math.round(h * 0.85);
    const xFin = Math.min(bmp.width, xInicio + anchoEstimado);
    const w = xFin - xInicio;
    if (w < 20 || h < 20){ if (bmp.close) bmp.close(); return null; }
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bmp, xInicio, yInicio, w, h, 0, 0, w, h);
    if (bmp.close) bmp.close();
    return canvas.toDataURL("image/jpeg", 0.85);
  }catch(_e){
    return null;
  }
}

// Overlay circular de pantalla completa que se usa en TODO el sistema (leer documentos,
// guardar un trámite, subir foto/documento/exámenes/COFIPRO, guardar una plantilla, etc.),
// con un mínimo de tiempo visible para que se sienta como un proceso real y no un parpadeo.
const CARGA_MIN_MS = 1800;
let cargandoInicioMs = 0;
function mostrarCargando(mensaje, file){
  ocultarCargando();
  cargandoInicioMs = Date.now();
  const fondo = document.createElement("div");
  fondo.className = "scan-overlay-fondo";
  fondo.id = "cargandoOverlay";
  const imgHtml = file ? `<img class="scan-overlay-img" src="${URL.createObjectURL(file)}">` : "";
  fondo.innerHTML = `<div class="scan-overlay-tarjeta">
      ${imgHtml}
      <div class="scan-overlay-spinner">
        <div class="scan-ring-wrap">
          <div class="scan-ring"></div>
          <div class="scan-ring-label">MTC</div>
        </div>
        <div class="scan-ring-sub">${escapa(mensaje || "Procesando…")}</div>
      </div>
    </div>`;
  document.body.appendChild(fondo);
}
async function ocultarCargando(){
  const prev = document.getElementById("cargandoOverlay");
  if (!prev) return;
  const restante = CARGA_MIN_MS - (Date.now() - cargandoInicioMs);
  if (restante > 0) await new Promise(r => setTimeout(r, restante));
  prev.remove();
}
async function escanearDocumento(inputEl, targets, msgId){
  const f = inputEl.files[0];
  if (!f) return;
  const msg = $(msgId);
  if (typeof Tesseract === "undefined"){
    msg.style.color = "var(--rojo)";
    msg.textContent = "No se pudo cargar el lector de documentos. Verifica tu conexión a internet.";
    return;
  }
  mostrarCargando("Leyendo documento…", f);
  msg.style.color = "var(--gris)";
  msg.textContent = "Leyendo documento… 0%";
  try{
    let anchoOriginal = 0;
    try{
      const bmpOrig = await createImageBitmap(f);
      anchoOriginal = bmpOrig.width;
      if (bmpOrig.close) bmpOrig.close();
    }catch(_e){ /* seguimos sin esto; solo afecta el recorte de foto */ }
    const archivo = await preprocesarImagen(f);
    let anchoImagen = 0;
    try{
      const bmp = await createImageBitmap(archivo);
      anchoImagen = bmp.width;
      if (bmp.close) bmp.close();
    }catch(_e){ /* si falla, seguimos sin recorte por posición */ }
    const { data } = await Tesseract.recognize(archivo, "spa", {
      logger: m => {
        if (m.status === "recognizing text") msg.textContent = "Leyendo documento… " + Math.round(m.progress * 100) + "%";
      }
    });
    const textoPosicion = reconstruirPorPosicion(data, anchoImagen);
    const textoUsado = textoPosicion || data.text;
    // Se prueban ambas versiones del texto (la del OCR tal cual y la reconstruida por
    // posición) y se combina lo mejor de cada una, porque según la foto una u otra
    // detecta mejor cada dato.
    const infoTexto = parsearDNI(data.text);
    const infoPosicion = textoPosicion ? parsearDNI(textoPosicion) : {};
    const info = {
      dni: infoTexto.dni || infoPosicion.dni || "",
      nombres: infoTexto.nombres || infoPosicion.nombres || "",
      apellidos: infoTexto.apellidos || infoPosicion.apellidos || "",
      direccion: infoTexto.direccion || infoPosicion.direccion || ""
    };
    let encontrado = false;
    // No se sobrescribe un campo que ya tiene un valor (por ejemplo, si ya se escaneó el
    // frente, el reverso no debe reemplazar el nombre con lo que lea del MRZ).
    if (info.dni && targets.dni && $(targets.dni) && !$(targets.dni).disabled && !$(targets.dni).value.trim()){ $(targets.dni).value = info.dni; encontrado = true; }
    if (info.nombres && targets.nombres && $(targets.nombres) && !$(targets.nombres).value.trim()){ $(targets.nombres).value = info.nombres; encontrado = true; }
    if (info.apellidos && targets.apellidos && $(targets.apellidos) && !$(targets.apellidos).value.trim()){ $(targets.apellidos).value = info.apellidos; encontrado = true; }
    if (info.direccion && targets.direccion && $(targets.direccion) && !$(targets.direccion).value.trim()){ $(targets.direccion).value = info.direccion; encontrado = true; }

    let bloqueFoto = "";
    if (targets.foto){
      const factorEscala = (anchoOriginal && anchoImagen) ? (anchoImagen / anchoOriginal) : 1;
      const foto = await recortarFotoFicha(data, f, factorEscala);
      if (foto){
        fotoEscaneada = foto;
        encontrado = true;
        bloqueFoto = `<div style="margin-top:8px"><img src="${foto}" style="width:60px;height:75px;object-fit:cover;border-radius:6px;border:2px solid var(--verde)"><div style="font-size:11px;color:var(--gris);margin-top:2px">Foto detectada — se guardará con el trámite.</div></div>`;
      }
    }

    const idTexto = msgId + "Raw";
    const textoEscapado = escapa(textoUsado.trim()).replace(/\n/g, "<br>");
    const bloqueTexto = `<div style="margin-top:6px"><button type="button" class="link" style="font-size:11px" onclick="const d=document.getElementById('${idTexto}'); d.classList.toggle('oculto')">👁️ Ver texto que detectó el lector</button><div id="${idTexto}" class="oculto" style="background:#fff;border:1px solid var(--borde);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:11px;color:var(--texto);max-height:140px;overflow-y:auto">${textoEscapado || "(no se detectó texto)"}</div></div>`;
    if (encontrado){
      msg.style.color = "var(--verde)";
      msg.innerHTML = "✓ Datos detectados. Verifícalos antes de guardar — el lector puede equivocarse." + bloqueFoto + bloqueTexto;
    } else {
      msg.style.color = "var(--rojo)";
      msg.innerHTML = "No se pudieron detectar los datos automáticamente. Complétalos manualmente; revisa abajo lo que alcanzó a leer el lector, puede ayudarte a copiarlos." + bloqueTexto;
    }
  }catch(e){
    msg.style.color = "var(--rojo)";
    msg.textContent = "Error al leer el documento. Inténtalo de nuevo o completa manualmente.";
  }finally{
    await ocultarCargando();
  }
}

// ---------- Lector de la consulta oficial de papeletas (scppp.mtc.gob.pe) ----------
// El cliente/gestor hace la consulta él mismo en el portal oficial (con su captcha) y sube
// una foto o captura de esa pantalla de resultados; el lector extrae los datos y arma una
// tabla igual a la del portal oficial, para que la información que se le muestra al cliente
// sea exacta. Como es una tabla (no una ficha de etiqueta:valor), el resultado es un cálculo
// aproximado — siempre se muestra editable para revisar antes de guardar.
let filasOficialesEscaneadas = [];
let infoOficialEscaneada = null;
// Todas las etiquetas de esta pantalla, para no confundir una etiqueta con el valor de la
// anterior cuando el OCR no detecta los dos puntos (":") — algo muy frecuente.
const OTRA_ETIQUETA_PAP = /CONSULTA\s*DEL\s*ADMINISTRADO|NRO\.?\s*DE\s*DOCUMENTO|NRO\.?\s*DE\s*LICENCIA|CLASE\s*Y\s*CATEGORIA|VIGENTE\s*HASTA|ESTADO\s*DE\s*LA\s*LICENCIA|LISTADO\s*DE\s*PAPELETAS|^ENTIDAD\b|^PAPELETA\b|^FALTA\b|^RETENCION\b|^FIRME\b/i;
function parsearConsultaPapeletas(texto){
  const lineas = String(texto || "").split("\n").map(l => l.trim()).filter(Boolean);
  const idx = re => lineas.findIndex(l => re.test(l));
  function valorTrasEtiqueta(i, re){
    if (i < 0) return "";
    const linea = lineas[i];
    const m = linea.match(re);
    // El valor "-" (sin dato) puede leerse como distintos tipos de raya según el OCR.
    const esGuionSuelto = t => /^[-–—―‐]+$/.test(t);
    if (m){
      const despues = linea.slice(m.index + m[0].length).replace(/^[:\-–—―‐\s]+/, "").trim();
      if (despues && !esGuionSuelto(despues) && !OTRA_ETIQUETA_PAP.test(despues)) return despues;
      if (esGuionSuelto(despues)) return "";
    }
    const sig = lineas[i + 1];
    if (sig && !OTRA_ETIQUETA_PAP.test(sig)) return esGuionSuelto(sig) ? "" : sig;
    return "";
  }
  const administradoCrudo = valorTrasEtiqueta(idx(/CONSULTA\s*DEL\s*ADMINISTRADO/i), /CONSULTA\s*DEL\s*ADMINISTRADO/i);
  // Se quitan símbolos sueltos que a veces deja el lector al inicio (guiones, rayas) sin tocar
  // el nombre real.
  const administrado = administradoCrudo.replace(/^[^A-ZÑÁÉÍÓÚ]+/i, "").trim();
  let dni = valorTrasEtiqueta(idx(/NRO\.?\s*DE\s*DOCUMENTO/i), /NRO\.?\s*DE\s*DOCUMENTO[^:]*/i);
  // El DNI peruano son siempre 8 dígitos: si la etiqueta no dio un valor así de limpio, se busca
  // en todo el texto cualquier número suelto de 8 dígitos como respaldo.
  if (!/^\d{8}$/.test(dni)){
    const m = String(texto || "").match(/\b\d{8}\b/);
    if (m) dni = m[0];
  }
  const numeroLicencia = valorTrasEtiqueta(idx(/NRO\.?\s*DE\s*LICENCIA/i), /NRO\.?\s*DE\s*LICENCIA/i);
  const claseCategoria = valorTrasEtiqueta(idx(/CLASE\s*Y\s*CATEGORIA/i), /CLASE\s*Y\s*CATEGORIA/i);
  const vigenteHasta = valorTrasEtiqueta(idx(/VIGENTE\s*HASTA/i), /VIGENTE\s*HASTA/i);
  const estadoLicencia = valorTrasEtiqueta(idx(/ESTADO\s*DE\s*LA\s*LICENCIA/i), /ESTADO\s*DE\s*LA\s*LICENCIA/i);

  // Tabla: busca la línea de cabecera ("ENTIDAD ... PAPELETA ... FECHA ...") y a partir de ahí
  // intenta leer cada fila. El formato real: N° ENTIDAD PAPELETA FECHA [FECHA FIRME] FALTA
  // ESTADO DEUDA [RESOLUCION] RETENCION(SI/NO).
  // Anclado al inicio de línea con \b: "ENTIDAD" (sin anclar) también hace match dentro de
  // "IDENTIDAD" (NRO. DE DOCUMENTO DE IDENTIDAD), lo que hacía arrancar la tabla demasiado
  // pronto y confundía los campos de arriba con filas de la tabla.
  const iCab = idx(/^ENTIDAD\b/i);
  const filas = [];
  // El N° de fila inicial y la retención (SI/NO) son opcionales porque el OCR a veces no los
  // detecta (o lee basura de un ícono al final de la fila); se toleran también restos sueltos
  // al final de la línea sin que rompan la lectura de lo demás.
  // El código de falta normalmente empieza con 1-2 letras (M28, G12, L05), pero se acepta que
  // falten esas letras (0) porque el lector a veces confunde una letra con un número parecido
  // (la "G" con "6", la "O" con "0", etc.) — mejor detectar el resto de la fila igual y que se
  // corrija el código a mano, que perder toda la fila por esa sola confusión.
  const RE_FILA = /^(?:(\d+)\s+)?(.+?)\s+(\d{3,7})\s+(\d{2}\/\d{2}\/\d{4})\s*(\d{2}\/\d{2}\/\d{4})?\s*([A-Z]{0,2}\d{1,3}[A-Z]?)\s+(.+?)\s*\b(SI|NO)?\b[^A-Za-z0-9]*$/i;
  if (iCab >= 0){
    for (let j = iCab + 1; j < lineas.length; j++){
      const l = lineas[j];
      if (/Desarrollado\s*por/i.test(l)) break;
      if (/^(ENTIDAD|PAPELETA|FECHA|FALTA|ESTADO\s*DEUDA|RESOLUCION|RETENCION|FIRME|LICENCIA)\b/i.test(l)) continue;
      const m = l.match(RE_FILA);
      if (!m){
        // No calzó el patrón esperado: si la línea tiene contenido real (no es ruido suelto de
        // 1-2 caracteres), se guarda igual completa en "Entidad" para no perder el dato — mejor
        // corregirla a mano que no tenerla.
        if (l.length >= 5) filas.push({ entidad: l, papeleta: "", fecha: "", fechaFirme: "", falta: "", estadoDeuda: "", resolucion: "", retencion: "NO" });
        continue;
      }
      filas.push({
        entidad: m[2].trim(),
        papeleta: m[3].trim(),
        fecha: m[4] || "",
        fechaFirme: m[5] || "",
        falta: (m[6] || "").toUpperCase(),
        estadoDeuda: (m[7] || "").trim(),
        resolucion: "",
        retencion: (m[8] || "").toUpperCase() || "NO"
      });
    }
  }
  return { administrado, dni, numeroLicencia, claseCategoria, vigenteHasta, estadoLicencia, filas };
}
function filaOficialHtml(f, i){
  const campo = (k, v, ancho) => `<input data-campo="${k}" data-fila="${i}" value="${escapa(v||"")}" style="width:${ancho}px;padding:5px 6px;font-size:11px;margin:0">`;
  return `<tr>
    <td>${campo("entidad", f.entidad, 130)}</td>
    <td>${campo("papeleta", f.papeleta, 70)}</td>
    <td>${campo("fecha", f.fecha, 80)}</td>
    <td>${campo("fechaFirme", f.fechaFirme, 80)}</td>
    <td>${campo("falta", f.falta, 55)}</td>
    <td>${campo("estadoDeuda", f.estadoDeuda, 110)}</td>
    <td>${campo("resolucion", f.resolucion, 80)}</td>
    <td>${campo("retencion", f.retencion, 45)}</td>
    <td><button type="button" class="btn-sec" style="padding:4px 8px;font-size:11px" onclick="quitarFilaOficial(${i})">✕</button></td>
  </tr>`;
}
function renderTablaOficialEditable(){
  const cont = $("pTablaOficial");
  if (!cont) return;
  if (!filasOficialesEscaneadas.length){ cont.innerHTML = ""; return; }
  cont.innerHTML = `<div style="overflow-x:auto;margin-top:8px">
    <table style="font-size:11px;border-collapse:collapse;width:100%">
      <thead><tr style="text-align:left;color:var(--gris)"><th>Entidad</th><th>Papeleta</th><th>Fecha</th><th>Fecha firme</th><th>Falta</th><th>Estado deuda</th><th>Resolución</th><th>Retención</th><th></th></tr></thead>
      <tbody>${filasOficialesEscaneadas.map(filaOficialHtml).join("")}</tbody>
    </table>
  </div>
  <button type="button" class="btn-sec" style="margin-top:8px;font-size:11px" onclick="agregarFilaOficial()">+ Agregar fila</button>`;
}
// Marca en la lista de "Papeletas del cliente" (más abajo en el formulario) la casilla de
// cada código de falta que el lector detectó en la tabla de la consulta oficial, comparando
// sin distinguir mayúsculas/minúsculas (el catálogo puede tener códigos como "M20a").
function marcarPapeletasDetectadas(filas){
  const marcados = [];
  (filas || []).forEach(f => {
    const codigo = (f.falta || "").trim();
    if (!codigo) return;
    const chk = [...document.querySelectorAll(".chkPap")].find(c => c.value.toUpperCase() === codigo.toUpperCase());
    if (chk && !chk.checked){ chk.checked = true; marcados.push(chk.value); }
  });
  return marcados;
}
function agregarFilaOficial(){
  filasOficialesEscaneadas.push({ entidad:"", papeleta:"", fecha:"", fechaFirme:"", falta:"", estadoDeuda:"", resolucion:"", retencion:"NO" });
  renderTablaOficialEditable();
}
function quitarFilaOficial(i){
  filasOficialesEscaneadas.splice(i, 1);
  renderTablaOficialEditable();
}
function leerFilasOficialesDesdeDOM(){
  const cont = $("pTablaOficial");
  if (!cont) return [];
  const filas = {};
  cont.querySelectorAll("input[data-fila]").forEach(inp => {
    const i = inp.dataset.fila;
    filas[i] = filas[i] || {};
    filas[i][inp.dataset.campo] = inp.value.trim();
  });
  return Object.values(filas);
}
async function escanearConsultaOficial(inputEl){
  const f = inputEl.files[0];
  if (!f) return;
  const msg = $("pScanOficialMsg");
  if (typeof Tesseract === "undefined"){
    msg.style.color = "var(--rojo)";
    msg.textContent = "No se pudo cargar el lector de documentos. Verifica tu conexión a internet.";
    return;
  }
  mostrarCargando("Leyendo consulta de papeletas…", f);
  msg.style.color = "var(--gris)";
  msg.textContent = "Leyendo documento… 0%";
  try{
    const archivo = await preprocesarImagen(f, true);
    let anchoImagen = 0;
    try{
      const bmp = await createImageBitmap(archivo);
      anchoImagen = bmp.width;
      if (bmp.close) bmp.close();
    }catch(_e){ /* sigue sin esto */ }
    const { data } = await Tesseract.recognize(archivo, "spa", {
      logger: m => { if (m.status === "recognizing text") msg.textContent = "Leyendo documento… " + Math.round(m.progress * 100) + "%"; }
    });
    // Sin límite de ancho: a diferencia del DNI, aquí la mitad derecha de la imagen tiene
    // columnas con datos (Estado deuda, Resolución, Retención), no una foto que descartar.
    const textoPosicion = reconstruirPorPosicion(data, anchoImagen, true);
    // Se prueban las dos versiones del texto (la del OCR tal cual y la reconstruida por
    // posición) y se combina lo mejor de cada una — igual que con el DNI, porque según la
    // foto una u otra detecta mejor cada dato.
    const infoTexto = parsearConsultaPapeletas(data.text);
    const infoPosicion = textoPosicion ? parsearConsultaPapeletas(textoPosicion) : { filas:[] };
    const info = {
      administrado: infoTexto.administrado || infoPosicion.administrado || "",
      dni: infoTexto.dni || infoPosicion.dni || "",
      numeroLicencia: infoTexto.numeroLicencia || infoPosicion.numeroLicencia || "",
      claseCategoria: infoTexto.claseCategoria || infoPosicion.claseCategoria || "",
      vigenteHasta: infoTexto.vigenteHasta || infoPosicion.vigenteHasta || "",
      estadoLicencia: infoTexto.estadoLicencia || infoPosicion.estadoLicencia || "",
      filas: infoPosicion.filas.length >= infoTexto.filas.length ? infoPosicion.filas : infoTexto.filas
    };
    let encontrado = false;
    if (info.dni && $("pDni") && !$("pDni").value.trim()){ $("pDni").value = info.dni; encontrado = true; }
    if (info.administrado && $("pNom") && !$("pNom").value.trim() && $("pApe") && !$("pApe").value.trim()){
      const partes = info.administrado.split(/\s+/).filter(Boolean);
      // El portal oficial siempre ordena el nombre igual que el DNI: Apellido Paterno,
      // Apellido Materno y luego los Nombres (que pueden ser uno o varios).
      if (partes.length >= 3){
        $("pApe").value = partes.slice(0, 2).join(" ");
        $("pNom").value = partes.slice(2).join(" ");
      } else if (partes.length === 2){
        $("pApe").value = partes[0];
        $("pNom").value = partes[1];
      } else if (partes.length === 1){
        $("pNom").value = partes[0];
      }
      encontrado = true;
    }
    filasOficialesEscaneadas = info.filas;
    infoOficialEscaneada = { numeroLicencia: info.numeroLicencia, claseCategoria: info.claseCategoria, vigenteHasta: info.vigenteHasta, estadoLicencia: info.estadoLicencia };
    if (filasOficialesEscaneadas.length) encontrado = true;
    renderTablaOficialEditable();
    // Marca sola la casilla de "Papeletas del cliente" cuyo código coincide con lo detectado
    // en la tabla de la consulta oficial, para no tener que buscarla y marcarla a mano.
    const codigosMarcados = marcarPapeletasDetectadas(filasOficialesEscaneadas);
    const textoEscapado1 = escapa((data.text||"").trim()).replace(/\n/g, "<br>");
    const textoEscapado2 = escapa((textoPosicion||"").trim()).replace(/\n/g, "<br>");
    const bloqueTexto = `<div style="margin-top:6px"><button type="button" class="link" style="font-size:11px" onclick="const d=document.getElementById('pScanOficialRaw'); d.classList.toggle('oculto')">👁️ Ver texto que detectó el lector</button><div id="pScanOficialRaw" class="oculto" style="background:#fff;border:1px solid var(--borde);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:11px;color:var(--texto);max-height:180px;overflow-y:auto"><b>Texto (OCR):</b><br>${textoEscapado1 || "(vacío)"}<hr style="margin:8px 0;border:none;border-top:1px solid var(--borde)"><b>Texto (por posición):</b><br>${textoEscapado2 || "(vacío)"}</div></div>`;
    if (encontrado){
      const avisoMarcadas = codigosMarcados.length
        ? ` Se marcó sola${codigosMarcados.length===1?"":"n"} en la lista de abajo: ${codigosMarcados.join(", ")}.`
        : (filasOficialesEscaneadas.length ? " No encontré en el catálogo el código exacto de la tabla — márcala tú mismo abajo, o corrige el código \"Falta\" en la tabla si el lector lo leyó mal." : "");
      msg.style.color = "var(--verde)";
      msg.innerHTML = `✓ Datos detectados (${filasOficialesEscaneadas.length} papeleta${filasOficialesEscaneadas.length===1?"":"s"} en la tabla). Revisa y corrige cualquier dato antes de registrar — el lector puede equivocarse, sobre todo en la tabla.${avisoMarcadas}` + bloqueTexto;
    } else {
      msg.style.color = "var(--rojo)";
      msg.innerHTML = "No se pudo leer la tabla automáticamente. Agrega las filas manualmente con el botón de abajo, o revisa lo que alcanzó a leer el lector." + bloqueTexto;
      renderTablaOficialEditable();
    }
  }catch(e){
    msg.style.color = "var(--rojo)";
    msg.textContent = "Error al leer el documento. Inténtalo de nuevo o completa manualmente.";
  }finally{
    await ocultarCargando();
  }
}

function cerrarModal(){ $("zonaModal").innerHTML = ""; }
function actualizarNumeroLicencia(){
  const dni = $("mDni").value.trim();
  const campo = $("mNumLic");
  if (campo && /^\d{8}$/.test(dni)) campo.value = "Q" + dni;
}

async function guardarExpediente(id){
  const dni = $("mDni").value.trim();
  const nom = $("mNom").value.trim(), ape = $("mApe").value.trim();
  if (!/^\d{8}$/.test(dni)) return alert("El DNI debe tener 8 dígitos.");
  if (!nom || !ape) return alert("Nombres y apellidos son obligatorios.");
  mostrarCargando("Guardando trámite…");
  const datos = {
    telefono: $("mTel").value.trim(), correo: $("mCor").value.trim(),
    direccion: $("mDir").value.trim(), nombres: nom, apellidos: ape,
    tipo: $("mTipo").value, responsable: $("mRes").value.trim(),
    estado: $("mEstado").value, fechaFin: $("mFin").value,
    categoria: $("mCat").value.trim(), sede: $("mSede").value.trim(),
    observaciones: $("mObs").value.trim(),
    tipoLicencia: $("mTipoLic").value, restricciones: $("mRestr").value.trim(),
    centroEmision: $("mCentro").value.trim(), numeroLicencia: $("mNumLic").value.trim(),
    fechaExpedicion: $("mFechaExp").value, vigenteHasta: $("mVigente").value
  };
  if (id){
    const e = expedientes.find(x => x.id === id);
    const cambioEstado = e.estado !== datos.estado;
    Object.assign(e, datos);
    e.historial.unshift({ fecha: ahora(), usuario: sesion.nombre, accion: cambioEstado ? "Cambió estado a " + ESTADOS[datos.estado].txt : "Editó el expediente" });
    log(`Editó expediente DNI ${e.dni}` + (cambioEstado ? ` (estado → ${ESTADOS[datos.estado].txt})` : ""));
    if (cambioEstado) notificar(`El trámite de ${e.nombres} ${e.apellidos} pasó a: ${ESTADOS[datos.estado].txt}`);
  } else {
    if (expedientes.some(x => x.dni === dni && x.tipo === datos.tipo))
      return alert("Ya existe un trámite de este tipo registrado con ese DNI.");
    const hoy = new Date();
    expedientes.unshift({
      id: "E" + Date.now(), dni,
      fechaRegistro: hoy.toLocaleDateString("es-PE"),
      fechaISO: hoy.toISOString().slice(0,10),
      registroMs: Date.now(),
      docs: [], foto: fotoEscaneada || null, examenes: null, cofipro: null,
      historial: [{ fecha: ahora(), usuario: sesion.nombre, accion: "Registró el trámite" }],
      ...datos
    });
    log(`Registró trámite ${TIPOS[datos.tipo]} · DNI ${dni}`);
    notificar(`Nuevo trámite registrado: ${nom} ${ape} (${TIPOS[datos.tipo]})`);
    fotoEscaneada = null;
  }
  guarda("mtc_expedientes", expedientes);
  guardarExpedienteNube(id ? expedientes.find(x => x.id === id) : expedientes[0]);
  await ocultarCargando();
  cerrarModal();
  irVista(vistaActual);
}
function eliminarExp(id){
  const e = expedientes.find(x => x.id === id);
  if (!confirm(`¿Eliminar el expediente de ${e.nombres} ${e.apellidos}? Esta acción no se puede deshacer.`)) return;
  expedientes = expedientes.filter(x => x.id !== id);
  guarda("mtc_expedientes", expedientes);
  eliminarExpedienteNube(id);
  log(`Eliminó expediente DNI ${e.dni}`);
  irVista(vistaActual);
}

// ---------- Documentos ----------
function subirDoc(id){
  const inp = $("mDoc"), f = inp.files[0];
  if (!f) return;
  if (f.size > 2*1024*1024) return alert("Máximo 2 MB por documento (límite del almacenamiento local).");
  mostrarCargando("Guardando documento…", f);
  const r = new FileReader();
  r.onload = async () => {
    const e = expedientes.find(x => x.id === id);
    e.docs.push({ nombre: f.name, data: r.result });
    e.historial.unshift({ fecha: ahora(), usuario: sesion.nombre, accion: "Subió documento: " + f.name });
    guarda("mtc_expedientes", expedientes);
    guardarExpedienteNube(e);
    log(`Subió documento a DNI ${e.dni}`);
    await ocultarCargando();
    abrirExpediente(id);
  };
  r.readAsDataURL(f);
}
function descargarDoc(id, i){
  const d = expedientes.find(x => x.id === id).docs[i];
  const a = document.createElement("a");
  a.href = d.data; a.download = d.nombre; a.click();
}
function borrarDoc(id, i){
  const e = expedientes.find(x => x.id === id);
  if (!confirm("¿Eliminar el documento " + e.docs[i].nombre + "?")) return;
  e.docs.splice(i,1);
  guarda("mtc_expedientes", expedientes);
  guardarExpedienteNube(e);
  abrirExpediente(id);
}
// ---------- Requisitos adicionales (exámenes / COFIPRO) ----------
// Solo aplica a Nueva licencia y Recategorización. Los 3 exámenes (manejo, conocimientos,
// médico) se manejan como un solo archivo. El certificado de COFIPRO recién se pide una vez
// que ya se subió ese archivo de exámenes.
function subirRequisito(id, campo, inputEl){
  const f = inputEl.files[0];
  if (!f) return;
  if (f.size > 2*1024*1024) return alert("Máximo 2 MB por archivo (límite del almacenamiento local).");
  mostrarCargando(campo === "examenes" ? "Guardando exámenes…" : "Guardando certificado COFIPRO…", f);
  const r = new FileReader();
  r.onload = async () => {
    const e = expedientes.find(x => x.id === id);
    e[campo] = { nombre: f.name, data: r.result };
    const etiqueta = campo === "examenes" ? "los exámenes (manejo, conocimientos y médico)" : "el certificado de COFIPRO";
    e.historial.unshift({ fecha: ahora(), usuario: sesion.nombre, accion: "Subió " + etiqueta + ": " + f.name });
    guarda("mtc_expedientes", expedientes);
    guardarExpedienteNube(e);
    log(`Subió ${campo === "examenes" ? "exámenes" : "COFIPRO"} a DNI ${e.dni}`);
    await ocultarCargando();
    abrirExpediente(id);
  };
  r.readAsDataURL(f);
}
function verArchivoRequisito(id, campo){
  const d = expedientes.find(x => x.id === id)[campo];
  const a = document.createElement("a");
  a.href = d.data; a.download = d.nombre; a.click();
}
function quitarRequisito(id, campo){
  const e = expedientes.find(x => x.id === id);
  if (!confirm("¿Quitar " + (campo === "examenes" ? "el archivo de exámenes" : "el certificado de COFIPRO") + "?")) return;
  e[campo] = null;
  // Si se quita el archivo de exámenes, el COFIPRO deja de tener sentido como requisito ya
  // cumplido (recién se pide DESPUÉS de subir los exámenes), así que también se limpia.
  if (campo === "examenes") e.cofipro = null;
  guarda("mtc_expedientes", expedientes);
  guardarExpedienteNube(e);
  log(`Quitó ${campo === "examenes" ? "exámenes" : "COFIPRO"} de DNI ${e.dni}`);
  abrirExpediente(id);
}
function subirFoto(id){
  const f = $("mFoto").files[0];
  if (!f) return;
  if (f.size > 1.5*1024*1024) return alert("La foto debe pesar menos de 1.5 MB.");
  mostrarCargando("Guardando foto…", f);
  const r = new FileReader();
  r.onload = async () => {
    const e = expedientes.find(x => x.id === id);
    e.foto = r.result;
    guarda("mtc_expedientes", expedientes);
    guardarExpedienteNube(e);
    log(`Actualizó foto de DNI ${e.dni}`);
    await ocultarCargando();
    abrirExpediente(id);
  };
  r.readAsDataURL(f);
}

// ---------- Motor: reemplaza los marcadores por los datos del cliente ----------
function generarDocumento(e){
  const colores = { tramite:"#F77F00", aprobado:"#1B9E4B", observado:"#D62828", finalizado:"#2264D1" };
  const hoy = new Date();
  const foto = e.foto ? `<img src="${e.foto}">` :
    `<div style="width:110px;height:138px;border:1px dashed #bbb;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:38px">&#128100;</div>`;
  const logoHeader = logoEmpresa
    ? `<img src="${logoEmpresa}" style="height:44px;width:auto;object-fit:contain;background:#fff;border-radius:6px;padding:4px">`
    : `<div class="marca">${escapa(EMPRESA.nombre)}</div>`;
  const vals = {
    "{{logo_empresa}}": logoHeader,
    "{{nombre_completo}}": escapa(e.nombres + " " + e.apellidos),
    "{{nombres}}": escapa(e.nombres),
    "{{apellidos}}": escapa(e.apellidos),
    "{{dni}}": escapa(e.dni),
    "{{telefono}}": escapa(e.telefono) || "—",
    "{{correo}}": escapa(e.correo) || "—",
    "{{direccion}}": escapa(e.direccion) || "—",
    "{{foto}}": foto,
    "{{tipo_tramite}}": TIPOS[e.tipo],
    "{{categoria}}": escapa(e.categoria) || "—",
    "{{sede}}": escapa(e.sede) || escapa(EMPRESA.direccion),
    "{{tipo_licencia}}": escapa(e.tipoLicencia) || "—",
    "{{restricciones}}": escapa(e.restricciones) || "Sin restricciones",
    "{{centro_emision}}": escapa(e.centroEmision) || "—",
    "{{numero_licencia}}": escapa(e.numeroLicencia) || "—",
    "{{fecha_expedicion}}": e.fechaExpedicion || "—",
    "{{vigente_hasta}}": e.vigenteHasta || "—",
    "{{estado}}": ESTADOS[e.estado].txt.toUpperCase(),
    "{{color_estado}}": colores[e.estado],
    "{{observaciones}}": escapa(e.observaciones) || "Sin observaciones.",
    "{{codigo_expediente}}": e.id.replace("E","EXP-"),
    "{{codigo_verificacion}}": "VF-" + e.dni + "-" + e.id.slice(-4),
    "{{fecha_registro}}": e.fechaRegistro,
    "{{fecha_fin}}": e.fechaFin || "—",
    "{{fecha_actual}}": hoy.toLocaleDateString("es-PE"),
    "{{hora_actual}}": hoy.toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"}),
    "{{responsable}}": escapa(e.responsable),
    "{{empresa}}": escapa(EMPRESA.nombre),
    "{{empresa_rubro}}": escapa(EMPRESA.rubro),
    "{{empresa_direccion}}": escapa(EMPRESA.direccion),
    "{{empresa_contacto}}": (EMPRESA.telefono ? "· Tel. " + escapa(EMPRESA.telefono) : "") + (EMPRESA.correo ? " · " + escapa(EMPRESA.correo) : "")
  };
  const tipoPlantilla = plantillas[e.tipo] ? e.tipo : "nueva";
  // Se corrige el encabezado (logo/CSS desactualizados) en cada generación, no solo al entrar
  // a "Administrador de plantillas": así el PDF, la vista previa y la impresión usan siempre
  // la versión correcta sin depender de que el usuario haya visitado esa pantalla antes.
  plantillas[tipoPlantilla].html = migrarLogoEnPlantilla(plantillas[tipoPlantilla].html);
  guarda("mtc_plantillas", plantillas);
  let html = plantillas[tipoPlantilla].html;
  Object.entries(vals).forEach(([k,v]) => { html = html.split(k).join(v); });
  return html;
}

function imprimirConstancia(id){
  const e = expedientes.find(x => x.id === id);
  if (!e) return;
  const w = abrirVentana();
  if (!w) return;
  w.document.write(`<html><head><meta charset="UTF-8"><title>Constancia ${e.dni}</title></head><body>${generarDocumento(e)}
    <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
  log(`Generó constancia de DNI ${e.dni}`);
}

// ---------- Generar PDF real de la constancia (jsPDF + html2canvas) ----------
function generarPDFConstancia(id){
  const e = expedientes.find(x => x.id === id);
  if (!e) return;
  if (!window.jspdf || !window.html2canvas){
    alert("No se pudieron cargar las librerías de PDF. Verifica tu conexión a internet e intenta de nuevo.");
    return;
  }
  const cont = document.createElement("div");
  cont.style.cssText = "position:fixed; left:-9999px; top:0; width:720px; background:#fff";
  cont.innerHTML = generarDocumento(e);
  document.body.appendChild(cont);
  html2canvas(cont, { scale:2, useCORS:true }).then(canvas => {
    const { jsPDF } = window.jspdf;
    const img = canvas.toDataURL("image/jpeg", 0.95);
    const pdf = new jsPDF({ unit:"pt", format:"a4" });
    const pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
    const ratio = canvas.height / canvas.width;
    let w = pageW - 40, h = w * ratio;
    if (h > pageH - 40){ h = pageH - 40; w = h / ratio; }
    pdf.addImage(img, "JPEG", (pageW - w) / 2, 20, w, h);
    pdf.save(`constancia_${e.dni}.pdf`);
    document.body.removeChild(cont);
    log(`Generó PDF de constancia de DNI ${e.dni}`);
  }).catch(() => {
    document.body.removeChild(cont);
    alert("No se pudo generar el PDF. Verifica tu conexión a internet.");
  });
}
function generarPDFdesdeHeader(){
  const msg = $("hmMsg");
  const dni = ($("hmDni").value || "").trim();
  if (!/^\d{8}$/.test(dni)){ msg.textContent = "Ingresa un DNI válido de 8 dígitos."; return; }
  const coincidencias = expedientes.filter(x => x.dni === dni);
  if (!coincidencias.length){ msg.textContent = "No se encontró ningún trámite registrado con ese DNI."; return; }
  msg.textContent = "Generando PDF…";
  generarPDFConstancia(coincidencias[0].id);
  setTimeout(() => { msg.textContent = ""; $("hmDni").value = ""; }, 800);
}

// Encabezado del logo basado en tabla: a diferencia de un flexbox anidado, html2canvas (usado
// para exportar el PDF) lo posiciona de forma confiable — el flexbox anidado hacía que el
// encabezado se superpusiera con el resto de la constancia al generar el PDF.
const CAB_TABLA_HTML = `<table><tr>
      <td style="width:1%;white-space:nowrap;vertical-align:middle">{{logo_empresa}}</td>
      <td style="vertical-align:middle;padding-left:12px"><div class="rubro">{{empresa_rubro}}</div></td>
      <td class="cod" style="vertical-align:middle;white-space:nowrap">N° DE EXPEDIENTE<br><b>{{codigo_expediente}}</b></td>
    </tr></table>`;
// Si la plantilla todavía tiene el bloque de encabezado por defecto (sin logo) o la versión
// anterior basada en flexbox (que se superponía en el PDF), se reemplaza por la de tabla. Se
// usa el DOM en vez de comparar texto para que funcione sin importar el espaciado exacto
// guardado. Si el usuario ya personalizó el encabezado de otra forma, se deja tal cual.
function migrarLogoEnPlantilla(html){
  if (!html) return html;
  try{
    // La plantilla guardada trae su propio bloque <style> "congelado" desde que se creó: aunque
    // el diseño por defecto cambie más adelante, ese texto no se actualiza solo. Por eso la regla
    // .cab (que antes usaba flexbox y podía quedar desactualizada) se normaliza aquí también,
    // no solo el HTML del encabezado.
    html = html.replace(/\.cab\{[^}]*\}/, '.cab{background:#D62828;color:#fff;padding:22px 28px}');
    if (!html.includes(".cab table{")){
      html = html.replace('.cab{background:#D62828;color:#fff;padding:22px 28px}', '.cab{background:#D62828;color:#fff;padding:22px 28px}\n  .cab table{width:100%;border-collapse:collapse}');
    }
    const tmp = document.createElement("div");
    tmp.innerHTML = html;
    const cab = tmp.querySelector(".cab");
    if (!cab) return html;
    const flexRoto = cab.querySelector('div[style*="display:flex"]');
    const sinLogo = !cab.innerHTML.includes("{{logo_empresa}}");
    if (sinLogo || flexRoto){
      cab.innerHTML = CAB_TABLA_HTML;
      return tmp.innerHTML;
    }
    return tmp.innerHTML;
  }catch(_e){ return html; }
}
function subirLogoEncabezado(inputEl){

  const lector = new FileReader();

    guarda("mtc_logo", logoEmpresa);
    Object.keys(plantillas).forEach(k => { plantillas[k].html = migrarLogoEnPlantilla(plantillas[k].html); });
    guarda("mtc_plantillas", plantillas);
    log("Actualizó el logo de la empresa");
    pintarLogoHeaderTop();
    irVista(vistaActual);
  };
  lector.readAsDataURL(f);
}

function vistaCentrosEvaluacion(){
  const deptos = [...new Set(CENTROS_EVALUACION.map(c => c[0]))].sort();
  return `
    <h1 class="titulo-vista">Centros de Evaluación</h1>
    <div class="card" style="margin-bottom:16px">
      <p style="font-size:13px;color:var(--gris)">Lista de centros de evaluación autorizados por el MTC a nivel nacional (manejo, conocimientos y médico). Filtra por departamento, provincia y distrito, igual que en el portal oficial.</p>
      <div class="form-grid" style="margin-top:12px">
        <div><label>Departamento</label><select id="ceDepto" onchange="actualizarProvinciasCE()">
          <option value="">--Todos--</option>
          ${deptos.map(d => `<option value="${escapa(d)}">${escapa(d)}</option>`).join("")}
        </select></div>
        <div><label>Provincia</label><select id="ceProv" onchange="actualizarDistritosCE()"><option value="">--Todos--</option></select></div>
        <div><label>Distrito</label><select id="ceDist"><option value="">--Todos--</option></select></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:10px">
        <button class="btn" onclick="buscarCentrosCE()">BUSCAR</button>
        <button class="btn-sec" onclick="limpiarCentrosCE()">Limpiar</button>
      </div>
    </div>
    <div id="ceResultados"></div>`;
}
function actualizarProvinciasCE(){
  const depto = $("ceDepto").value;
  const provs = [...new Set(CENTROS_EVALUACION.filter(c => !depto || c[0] === depto).map(c => c[1]))].sort();
  $("ceProv").innerHTML = `<option value="">--Todos--</option>` + provs.map(p => `<option value="${escapa(p)}">${escapa(p)}</option>`).join("");
  $("ceDist").innerHTML = `<option value="">--Todos--</option>`;
}
function actualizarDistritosCE(){
  const depto = $("ceDepto").value, prov = $("ceProv").value;
  const dists = [...new Set(CENTROS_EVALUACION.filter(c => (!depto || c[0] === depto) && (!prov || c[1] === prov)).map(c => c[2]))].sort();
  $("ceDist").innerHTML = `<option value="">--Todos--</option>` + dists.map(d => `<option value="${escapa(d)}">${escapa(d)}</option>`).join("");
}
function buscarCentrosCE(){
  const depto = $("ceDepto").value, prov = $("ceProv").value, dist = $("ceDist").value;
  const filtrados = CENTROS_EVALUACION.filter(c => (!depto || c[0] === depto) && (!prov || c[1] === prov) && (!dist || c[2] === dist));
  const filas = filtrados.map(c => `<tr><td>${escapa(c[0])}</td><td>${escapa(c[1])}</td><td>${escapa(c[2])}</td><td>${escapa(c[3])}</td><td>${escapa(c[4])}</td></tr>`).join("");
  const res = $("ceResultados");
  if (!res) return;
  res.innerHTML = filtrados.length
    ? `<div class="card"><p style="font-size:12px;color:var(--gris);margin-bottom:10px">${filtrados.length} resultado(s)</p><div class="tabla-scroll"><table><thead><tr><th>Departamento</th><th>Provincia</th><th>Distrito</th><th>Nombre del establecimiento</th><th>Dirección</th></tr></thead><tbody>${filas}</tbody></table></div></div>`
    : `<div class="card"><p style="color:var(--gris)">No se encontraron centros con esos filtros.</p></div>`;
}
function limpiarCentrosCE(){
  $("ceDepto").value = "";
  actualizarProvinciasCE();

function cambiarTabConsulta(tab){

// Papeletas: usa las solicitudes que la propia gestoría ya está tramitando (no el portal
// oficial del MTC, que pide captcha y no se puede consultar automáticamente desde aquí).
function renderPapeletasConsulta(dni){
  const propias = solicitudes.filter(s => s.dni === dni);
  if (!propias.length) return `<div class="card"><p style="color:var(--gris)">No se encontraron solicitudes de eliminación de papeletas registradas con ese DNI.</p></div>`;
  return propias.map(s => {
    const e = EST_PAP[s.estado];
    const totalPuntos = s.papeletas.reduce((a,p) => a + ((catalogo[p.codigo]||{}).p || 0), 0);
    const totalMulta = s.papeletas.reduce((a,p) => a + ((catalogo[p.codigo]||{}).m || 0), 0);
    const barraHtml = s.estado !== "finalizada"
      ? `<div style="background:var(--fondo);border-radius:8px;height:10px;overflow:hidden;margin:10px 0">
          <div style="height:100%;width:${e.barra}%;background:${e.color};border-radius:8px;transition:width .6s"></div>
        </div>`
      : "";
    return `<div class="tramite-card">
      <div class="top">
        <div>
          <div class="tipo">Solicitud de eliminación de papeletas</div>
          <div class="meta">${s.papeletas.length} papeleta(s) · Registrado el ${escapa(s.fechaRegistro)}</div>
          <div class="meta">Última actualización: ${escapa(s.actualizado)}</div>
        </div>
        <span class="estado-pill" style="background:${e.color}">${escapa(e.etq)}</span>
      </div>
      <p style="font-size:13px;margin-top:8px">${escapa(e.txt)}</p>
      ${barraHtml}
      <div class="docs-box">
        <span class="et">Papeletas incluidas</span>
        ${s.papeletas.map(p => `<span style="display:inline-block;background:${NIVEL_COLOR[(catalogo[p.codigo]||{}).n]||"#8B7F7F"};color:#fff;border-radius:12px;padding:3px 10px;margin:2px;font-weight:700;font-size:11px">${escapa(p.codigo)}</span>`).join("")}
        <div style="margin-top:8px;font-size:12px;color:var(--gris)">Total: <b>${totalPuntos} puntos</b> · ${soles(totalMulta)} en multas</div>
      </div>
      ${tablaConsultaOficialHtml(s.consultaOficial)}
      ${bloqueEliminarPapeleta(s, true)}
    </div>`;
  }).join("");
}

  if (!/^\d{8}$/.test(dni)){ msg.textContent = "Ingresa un DNI válido de 8 dígitos."; return; }

  const solicitudesPropias = solicitudes.filter(x => x.dni === dni);
  if (!coincidencias.length && !solicitudesPropias.length){ msg.textContent = "No se encontró ningún trámite ni solicitud registrado con ese DNI."; return; }
  msg.textContent = "";
  tabs.classList.remove("oculto");
  cambiarTabConsulta(coincidencias.length ? "tramite" : "papeletas");
  panelPapeletas.innerHTML = renderPapeletasConsulta(dni);
  if (!coincidencias.length){
    panelTramite.innerHTML = `<div class="card"><p style="color:var(--gris)">Este DNI no tiene trámites de licencia registrados.</p></div>`;
    return;
  }

  const c0 = coincidencias[0];
  const panelConductor = `<div class="panel-mtc">
    <h2>Datos del conductor</h2>
    <div class="grid">
      <div class="campo-mtc"><div class="et">Apellidos</div><div class="val">${escapa(c0.apellidos) || "—"}</div></div>
